<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#001a1e">
<title>📞 AURALIS · Call Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#001a1e;--panel:rgba(10,42,50,.94);--card:rgba(20,70,80,.7);
  --line:rgba(20,184,166,.14);--line2:rgba(20,184,166,.5);
  --txt:#e0fbfb;--txt2:#a0d8d8;--txt3:#4a7878;
  --teal:#14b8a6;--teal2:#2dd4bf;--cyan:#22d3ee;--emerald:#10b981;
  --lime:#84cc16;--amber:#fbbf24;--red:#ef4444;--blue:#3b82f6;
  --sh:0 8px 32px rgba(0,0,0,.7);--font:'Cairo','Inter',sans-serif;
}
html[lang="en"]{--font:'Inter','Cairo',sans-serif}
html[lang="en"] body{font-family:var(--font)}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:14px;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#loader{position:fixed;inset:0;z-index:9999;background:
  radial-gradient(circle at 50% 40%,rgba(20,184,166,.22),transparent 60%),#001a1e;
  display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#loader.off{opacity:0;visibility:hidden}
#loader .box{text-align:center}
#loader .sym{font-size:70px;filter:drop-shadow(0 0 40px rgba(20,184,166,.85));
  animation:pulse 1.6s ease-in-out infinite}
#loader .txt{margin-top:14px;color:var(--txt2);letter-spacing:3.5px;font-size:12px;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.7}}
header{position:fixed;top:0;left:0;right:0;min-height:56px;z-index:100;padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  transition:transform .4s cubic-bezier(.4,0,.2,1)}
header.hide{transform:translateY(-110%)}
.logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--cyan));display:grid;place-items:center;
  font-size:20px;color:#001a1e;box-shadow:0 4px 16px rgba(20,184,166,.55);
  border:1px solid rgba(20,184,166,.3)}
.title{display:flex;flex-direction:column;gap:1px;min-width:0}
.title .t1{font-size:14px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#fff,var(--teal));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap}
.title .t2{font-size:9.5px;color:var(--txt3);letter-spacing:1.2px;
  font-family:'JetBrains Mono',monospace;white-space:nowrap}
.spacer{flex:1}
.langBtn{height:38px;min-width:50px;padding:0 12px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;flex-shrink:0}
.langBtn:hover{border-color:var(--teal);color:var(--teal)}
.langBtn:active{transform:scale(.95)}
.btn{height:38px;min-width:38px;padding:0 12px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:6px;transition:transform .15s;flex-shrink:0}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.94)}
.btn.on{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#001a1e;border-color:transparent}
.hud{position:fixed;top:76px;inset-inline-end:12px;z-index:50;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:opacity .3s}
.hud .stat{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);
  padding:7px 13px;border-radius:11px;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--txt2);text-align:center;min-width:82px;transition:border-color .3s}
.hud .stat b{color:var(--cyan);font-weight:700;font-size:13px;display:block;margin-top:2px}
.hud .stat.good b{color:var(--emerald)}
.hud .stat.warn b{color:var(--amber)}
.tools{position:fixed;inset-inline-end:12px;bottom:230px;z-index:60;
  display:flex;flex-direction:column;gap:8px;transition:transform .4s,opacity .3s}
.tools.hide{transform:translateX(-160%);opacity:0}
.tool{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(20px);color:var(--txt);
  font-size:20px;cursor:pointer;display:grid;place-items:center;
  box-shadow:var(--sh);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.tool:hover{border-color:var(--line2);transform:translateY(-2px)}
.tool:active{transform:scale(.92)}
.tool.on{background:linear-gradient(135deg,var(--teal),var(--cyan));
  border-color:transparent;color:#001a1e;box-shadow:0 8px 24px rgba(20,184,166,.55)}
.info{position:fixed;top:76px;inset-inline-start:12px;z-index:70;width:270px;
  padding:15px;border-radius:16px;background:var(--panel);
  backdrop-filter:blur(24px);border:1px solid var(--line2);box-shadow:var(--sh);
  transform:translateX(calc(-100% - 30px));opacity:0;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;max-height:calc(100vh - 250px);overflow-y:auto}
.info.on{transform:translateX(0);opacity:1;pointer-events:auto}
.info h4{font-size:13px;font-weight:800;margin-bottom:3px;color:var(--teal);
  display:flex;align-items:center;gap:7px}
.info .tag{font-size:9.5px;color:var(--txt3);margin-bottom:11px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase}
.info .row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;font-size:11px;border-bottom:1px dashed var(--line)}
.info .row:last-of-type{border:none}
.info .row span:first-child{color:var(--txt3)}
.info .row span:last-child{color:var(--txt);font-weight:700;font-family:'JetBrains Mono',monospace}
.info .slider{margin-top:8px;display:flex;align-items:center;gap:7px}
.info .slider label{font-size:10px;color:var(--txt3);min-width:48px}
.info .slider input{flex:1;-webkit-appearance:none;appearance:none;height:3px;
  border-radius:2px;background:rgba(255,255,255,.12);outline:none}
.info .slider input::-webkit-slider-thumb{-webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 8px rgba(20,184,166,.7);cursor:pointer}
.info .slider b{font-size:10px;color:var(--teal);
  font-family:'JetBrains Mono',monospace;min-width:42px;text-align:end}
.info .numInput{width:64px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:6px;padding:3px 6px;font-family:inherit;font-size:11px}
.info .actions{display:flex;gap:6px;margin-top:12px}
.info .actions button{flex:1;padding:9px;border-radius:10px;font-family:inherit;
  font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--txt);transition:all .2s}
.info .actions button:hover{background:rgba(255,255,255,.05)}
.info .actions button.del{background:rgba(255,122,156,.15);color:#ff7a9c;
  border-color:rgba(255,122,156,.4)}
.info .dimRow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.info .dimRow h5{font-size:11px;font-weight:800;color:var(--teal);
  margin-bottom:8px;letter-spacing:.5px}
.info .presetBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.info .presetBtns button{padding:7px 3px;border-radius:8px;font-family:inherit;
  font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--txt2);transition:all .2s}
.info .presetBtns button:hover{border-color:var(--teal);color:var(--teal)}
.info .presetBtns button.on{background:linear-gradient(135deg,var(--teal),var(--cyan));
  color:#001a1e;border-color:transparent}
.picker{position:fixed;bottom:0;left:0;right:0;z-index:80;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
  background:var(--panel);backdrop-filter:blur(24px);
  border-top:1px solid var(--line);
  transition:transform .4s cubic-bezier(.4,0,.2,1)}
.picker.hide{transform:translateY(110%)}
.cats,.brands{display:flex;gap:6px;margin-bottom:7px;overflow-x:auto;
  scrollbar-width:none;padding-bottom:1px}
.cats::-webkit-scrollbar,.brands::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:10px;flex-shrink:0;background:var(--card);
  border:1.5px solid transparent;color:var(--txt2);font-family:inherit;
  font-size:11.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat.on{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#001a1e;
  box-shadow:0 4px 12px rgba(20,184,166,.5)}
.brand{padding:6px 12px;border-radius:9px;flex-shrink:0;background:var(--card);
  border:1px solid transparent;color:var(--txt2);font-family:inherit;font-size:11px;
  font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.brand.on{border-color:var(--lime);color:var(--lime);background:rgba(132,204,22,.12)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;
  max-height:120px;overflow-y:auto;scrollbar-width:thin;padding:1px}
.types::-webkit-scrollbar{width:4px}
.types::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.type{padding:8px 4px;border-radius:10px;background:var(--card);
  border:1.5px solid transparent;color:var(--txt2);font-family:inherit;
  font-size:9.5px;font-weight:700;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.type:hover{border-color:var(--line2)}
.type:active{transform:scale(.94)}
.type.on{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#001a1e;
  box-shadow:0 5px 16px rgba(20,184,166,.5)}
.type .em{font-size:20px;line-height:1}
.type .nm{font-size:9px;line-height:1.2;text-align:center}
.toast{position:fixed;bottom:195px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:11px 22px;border-radius:14px;background:var(--panel);
  backdrop-filter:blur(20px);border:1px solid var(--line2);
  font-size:13px;font-weight:700;color:var(--txt);opacity:0;pointer-events:none;
  transition:all .3s;z-index:200;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.presBtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:90;padding:13px 26px;border-radius:30px;
  background:linear-gradient(135deg,var(--teal),var(--cyan));
  color:#001a1e;font-family:inherit;font-size:13px;font-weight:800;
  border:0;cursor:pointer;display:none;box-shadow:0 12px 40px rgba(20,184,166,.55)}
.presBtn.on{display:block;animation:showB .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes showB{from{transform:translateX(-50%) scale(.5);opacity:0}}
.exitP{position:fixed;top:calc(22px + env(safe-area-inset-top,0));
  inset-inline-end:22px;z-index:100;width:46px;height:46px;border-radius:50%;
  background:rgba(10,42,50,.85);backdrop-filter:blur(20px);
  border:1px solid var(--line);color:var(--txt);font-size:20px;cursor:pointer;
  display:none;place-items:center;transition:all .2s}
.exitP.on{display:grid}
.exitP:active{transform:scale(.9)}
.modal{position:fixed;inset:0;background:rgba(0,26,30,.92);backdrop-filter:blur(10px);
  z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal-content{background:#0a2a30;border:1px solid var(--line2);border-radius:20px;
  width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.85);overflow:hidden;
  animation:slideUp .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px;background:rgba(10,42,50,.8)}
.modal-header h3{color:var(--teal);font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.modal-body{padding:22px;overflow-y:auto;font-size:13px;line-height:1.65}
.report-section{margin-bottom:20px}
.report-section:last-child{margin-bottom:0}
.report-section h4{color:var(--cyan);font-size:14px;margin-bottom:10px;
  border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;align-items:center;gap:8px}
.modal-body .row{display:flex;justify-content:space-between;gap:12px;
  padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.modal-body .row:last-child{border:none}
.modal-body .row span:first-child{color:var(--txt3)}
.modal-body .row span:last-child{font-weight:700;font-family:'JetBrains Mono',monospace}
.report-table{width:100%;border-collapse:collapse;margin-top:10px;
  border-radius:10px;overflow:hidden}
.report-table th,.report-table td{border:1px solid var(--line);
  padding:10px 12px;text-align:start;font-size:12px}
.report-table th{background:rgba(20,184,166,.22);color:#a7f3d0;font-weight:800}
.report-table tr:nth-child(even) td{background:rgba(20,184,166,.03)}
.modal-footer{padding:16px 20px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){
  .title .t2{display:none}
  .langBtn .label{display:none}
  .langBtn{min-width:42px;padding:0 10px}
  .btn{padding:0 9px;font-size:12px}
  .info{width:240px}
  .tool{width:44px;height:44px;font-size:18px}
  .types{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
}
@media print{
  body{background:#fff;color:#000;position:static}
  header,.tools,.hud,.picker,.presBtn,.exitP,.info,#c,.toast,#loader{display:none!important}
  .modal{position:absolute;inset:0;background:#fff;padding:0;display:block!important}
  .modal-content{border:none;box-shadow:none;max-height:none;width:100%;color:#000;background:#fff;animation:none}
  .modal-header{background:none;border-bottom:2px solid #000}
  .modal-header h3{color:#000}
  .modal-footer{display:none}
  .modal-body .row span:first-child{color:#555}
  .report-section h4{color:#000}
  .report-table th{background:#eee;color:#000}
  .report-table th,.report-table td{border:1px solid #999}
}
</style>
</head>
<body>

<div id="loader"><div class="box">
  <div class="sym">📞</div>
  <div class="txt" id="loaderTxt">LOADING CENTER…</div>
</div></div>

<canvas id="c"></canvas>

<header id="hd">
  <div class="logo">📞</div>
  <div class="title">
    <div class="t1">AURALIS</div>
    <div class="t2" id="roomLabel">CALL CENTER · AGENTS · SUPERVISORS · RECORDING</div>
  </div>
  <div class="spacer"></div>
  <button class="langBtn" id="langBtn" title="Language">
    <span class="flag">🌐</span>
    <span class="label" id="langLabel">EN</span>
  </button>
  <button class="btn" id="reportBtn" data-i18n-title="report_tip">📄</button>
  <button class="btn" id="viewBtn">🎬 3D</button>
  <button class="btn" id="shotBtn" data-i18n-title="shot_tip">📸</button>
  <button class="btn" id="presBtn" data-i18n-title="pres_tip">🎥</button>
</header>

<div class="hud" id="hud">
  <div class="stat" id="statDev"><span data-i18n="hud_devices">Devices</span><b id="hudCount">0</b></div>
  <div class="stat" id="statSpl"><span data-i18n="hud_spl">Max SPL</span><b id="hudSpl">—</b></div>
  <div class="stat" id="statCov"><span data-i18n="hud_coverage">Coverage</span><b id="hudCoverage">—</b></div>
</div>

<div class="tools" id="tools">
  <button class="tool on" id="heatBtn" data-i18n-title="heat_tip">🌡️</button>
  <button class="tool" id="fitBtn" data-i18n-title="fit_tip">🎯</button>
  <button class="tool on" id="gridBtn" data-i18n-title="grid_tip">▦</button>
  <button class="tool" id="camTopBtn" data-i18n-title="cam_top">⬆️</button>
  <button class="tool" id="camAgentBtn" data-i18n-title="cam_agent">👤</button>
  <button class="tool" id="saveBtn" data-i18n-title="save_tip">💾</button>
  <button class="tool" id="loadBtn" data-i18n-title="load_tip">📂</button>
  <button class="tool" id="clearBtn" data-i18n-title="clear_tip">🧹</button>
</div>

<input type="file" id="fileInput" style="display:none" accept=".json">

<div class="info" id="info">
  <h4>📦 <span id="infName">—</span></h4>
  <div class="tag" id="infBrand">—</div>
  <div class="row"><span data-i18n="inf_category">Category</span><span id="infType">—</span></div>
  <div class="row"><span data-i18n="inf_power">Power</span><span id="infPower">—</span></div>
  <div class="row"><span data-i18n="inf_height">Height</span><span id="infH">—</span></div>
  <div class="row"><span data-i18n="inf_position">Position</span><span id="infPos">—</span></div>
  <div class="slider" id="powerWrap">
    <label data-i18n="sl_power">Power</label>
    <input type="range" id="powerSlider" min="5" max="500" step="5" value="20">
    <b id="powerVal">20W</b>
  </div>
  <div class="slider" id="rotWrap">
    <label data-i18n="sl_rotation">Rotation</label>
    <input type="range" id="rotSlider" min="-180" max="180" step="5" value="0">
    <b id="rotVal">0°</b>
  </div>

  <div class="dimRow">
    <h5>📐 <span data-i18n="dim_title">Room Dimensions</span></h5>
    <div class="slider">
      <label data-i18n="inf_room_w">W</label>
      <input type="range" id="roomWSlider" min="12" max="70" step="1" value="26">
      <b id="roomWVal">26m</b>
    </div>
    <div class="slider">
      <label data-i18n="inf_room_d">D</label>
      <input type="range" id="roomDSlider" min="10" max="50" step="1" value="18">
      <b id="roomDVal">18m</b>
    </div>
    <div class="presetBtns">
      <button type="button" data-preset="small" data-i18n="dim_small">Small</button>
      <button type="button" data-preset="medium" data-i18n="dim_medium">Medium</button>
      <button type="button" data-preset="large" data-i18n="dim_large">Large</button>
    </div>
  </div>

  <div class="actions">
    <button class="del" id="delBtn" data-i18n="act_delete">🗑️ Delete</button>
  </div>
</div>

<div class="picker" id="picker">
  <div class="cats" id="cats"></div>
  <div class="brands" id="brands"></div>
  <div class="types" id="types"></div>
</div>

<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📋 <span data-i18n="rep_title">Acoustic Design Report</span></h3>
      <button class="btn" id="closeModalBtn" style="height:32px;min-width:32px;padding:0 8px">✕</button>
    </div>
    <div class="modal-body" id="reportModalBody"></div>
    <div class="modal-footer">
      <button class="btn on" id="printReportBtn" data-i18n="rep_print">🖨️ Print / Save PDF</button>
      <button class="btn" id="closeModalBtn2" data-i18n="rep_close">Close</button>
    </div>
  </div>
</div>

<button class="presBtn" id="presToggle" data-i18n="pres_start">🎥 Start Presentation</button>
<button class="exitP" id="exitPres">✕</button>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';

/* ============ I18N ============ */
const I18N = {
  ar: {
    loader:'جارٍ تحميل مركز الاتصال…',
    room_label:'مركز اتصال · وكلاء · مشرفون · تسجيل',
    hud_devices:'الأجهزة', hud_spl:'أقصى SPL', hud_coverage:'التغطية',
    report_tip:'تقرير', shot_tip:'لقطة', pres_tip:'عرض',

let LANG = localStorage.getItem('auralis_lang') || 'ar';
const T = k => (I18N[LANG] && I18N[LANG][k]) || k;

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.body.style.fontFamily = LANG === 'ar'
    ? "'Cairo','Inter',sans-serif" : "'Inter','Cairo',sans-serif";
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n; if (I18N[LANG][k]) el.textContent = I18N[LANG][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.dataset.i18nTitle; if (I18N[LANG][k]) el.title = I18N[LANG][k];
  });
  document.getElementById('langLabel').textContent = LANG === 'ar' ? 'EN' : 'ع';
  document.getElementById('loaderTxt').textContent = T('loader');
  document.getElementById('roomLabel').textContent = T('room_label');
  document.getElementById('presToggle').textContent = T('pres_start');
  document.title = LANG === 'ar' ? '📞 AURALIS · مركز اتصال' : '📞 AURALIS · Call Center';
}

/* ============ BUILD ROOM (fully parametric) ============ */
function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0]; g.remove(c);
    if (c.traverse) {
      c.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
          else o.material.dispose();
        }
      });
    }
  }
}

function buildRoom() {
  clearGroup(roomGrp);
  const W = ROOM.size[0];
  const D = ROOM.size[1];
  const H = ROOM.height;
  const T = 0.2;
  const hw = W/2, hd = D/2;

  /* --- FLOOR (carpet) --- */
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 0.05, D), M.carpet());
  floor.position.set(0, 0.025, 0); floor.receiveShadow = true; roomGrp.add(floor);

  /* --- CEILING --- */
  const ceil = new THREE.Mesh(new THREE.BoxGeometry(W, 0.1, D), M.ceiling());
  ceil.position.set(0, H, 0); roomGrp.add(ceil);
  /* Ceiling panels grid */
  const panelSpacing = 1.7;
  const nPx = Math.floor(W / panelSpacing);
  const nPz = Math.floor(D / panelSpacing);
  for (let i=0;i<nPx;i++) {
    for (let j=0;j<nPz;j++) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.06,1.6), M.ceilingPanel());
      panel.position.set(-W/2 + 0.85 + i*panelSpacing, H - 0.04, -D/2 + 0.85 + j*panelSpacing);
      roomGrp.add(panel);
    }
  }
  /* Ceiling point lights */
  for (let i=0;i<Math.min(8, Math.floor(W/3));i++) {
    const light = new THREE.PointLight(0xe0ffff, 0.5, Math.max(W,D), 2);
    light.position.set(-W/2 + (i+0.5)*(W/Math.min(8, Math.floor(W/3))), H - 0.4, 0);
    roomGrp.add(light);
  }

  /* --- WALLS --- */
  const wallPos = [
    { x:0, z:-hd, w:W, d:T },
    { x:0, z: hd, w:W, d:T },
    { x:-hw, z:0, w:T, d:D },
    { x: hw, z:0, w:T, d:D }
  ];
  for (const wp of wallPos) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(wp.w, H, wp.d), M.wall());
    w.position.set(wp.x, H/2, wp.z); w.receiveShadow = true; roomGrp.add(w);
    const isSide = wp.w < wp.d;
    const length = isSide ? wp.d : wp.w;
    /* Acoustic absorber panels on walls */
    const panelW = isSide ? 0.03 : 2.5;
    const panelD = isSide ? 2.5 : 0.03;
    for (let i=0;i<Math.floor(length/3);i++) {
      for (let r=0;r<2;r++) {
        const abs = new THREE.Mesh(
          new THREE.BoxGeometry(panelW * 1.05, 1.1, panelD * 1.05),
          M.absorberFrame()
        );
        const px = isSide ? wp.x + (wp.x>0?-0.02:0.02) : wp.x - length/2 + 1.5 + i*3;
        const pz = isSide ? wp.z - length/2 + 1.5 + i*3 : wp.z + (wp.z>0?-0.02:0.02);
        const py = 0.9 + r * 1.4;
        abs.position.set(px, py, pz);
        roomGrp.add(abs);
        const absIn = new THREE.Mesh(
          new THREE.BoxGeometry(panelW * 0.98, 1.0, panelD * 0.98),
          M.absorber()
        );
        absIn.position.set(px + (isSide ? (wp.x>0?-0.001:0.001) : 0), py, pz + (isSide ? 0 : (wp.z>0?-0.001:0.001)));
        roomGrp.add(absIn);
      }
    }
  }

  /* --- CEILING CLOUDS (acoustic) --- */
  const cloudCount = Math.max(4, Math.floor(W / 5));
  for (let i=0;i<cloudCount;i++) {
    const cx = -W/2 + (i + 0.5) * (W / cloudCount);
    const cloud = new THREE.Mesh(new THREE.BoxGeometry(W/cloudCount - 1, 0.25, D * 0.6), M.ceilingCloud());
    cloud.position.set(cx, H - 0.6, 0);
    roomGrp.add(cloud);
    /* Suspension cables */
    for (const dx of [-W/(cloudCount*3), 0, W/(cloudCount*3)]) {
      for (const dz of [-D*0.25, D*0.25]) {
        const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.5,4), M.metal());
        cable.position.set(cx + dx, H - 0.35, dz); roomGrp.add(cable);
      }
    }
  }

  /* --- AGENT WORKSTATIONS (dynamic grid) --- */
  /* Compute grid based on room size: aim for 1 desk per 20 m² */
  const area = W * D;
  const targetAgents = Math.max(6, Math.min(40, Math.floor(area / 20)));
  const cols = Math.max(3, Math.min(6, Math.round(Math.sqrt(targetAgents))));
  const rows = Math.max(2, Math.ceil(targetAgents / cols));
  const startX = -hw + 3;
  const endX = hw - 3;
  const startZ = -hd + 3;
  const endZ = hd - 6;   /* leave space at back for supervisors */
  const spacingX = (endX - startX) / Math.max(1, cols - 1);
  const spacingZ = (endZ - startZ) / Math.max(1, rows - 1);

  for (let r=0;r<rows;r++) {
    for (let c=0;c<cols;c++) {
      const cx = startX + c * spacingX;
      const cz = startZ + r * spacingZ;

      /* Desk surface */
      const desk = new THREE.Mesh(new THREE.BoxGeometry(spacingX * 0.75, 0.06, 1.3), M.deskTop());
      desk.position.set(cx, 0.75, cz); desk.castShadow = true; desk.receiveShadow = true;
      roomGrp.add(desk);
      const edge = new THREE.Mesh(new THREE.BoxGeometry(spacingX * 0.75, 0.04, 1.4), M.deskEdge());
      edge.position.set(cx, 0.71, cz); roomGrp.add(edge);
      /* Desk legs */
      for (const dx of [-spacingX*0.32, spacingX*0.32]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.72, 1.2), M.gray());
        leg.position.set(cx + dx, 0.36, cz); roomGrp.add(leg);
      }
      /* Acoustic partition (back + sides) */
      const partition = new THREE.Mesh(new THREE.BoxGeometry(spacingX * 0.75, 0.55, 0.05), M.partitionAc());
      partition.position.set(cx, 1.15, cz + 0.65); roomGrp.add(partition);
      const partitionEdge = new THREE.Mesh(new THREE.BoxGeometry(spacingX * 0.75, 0.06, 0.08), M.partition());
      partitionEdge.position.set(cx, 1.42, cz + 0.65); roomGrp.add(partitionEdge);
      /* Side partitions */
      for (const sx of [-1, 1]) {
        const side = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.45, 0.7), M.partitionAc());
        side.position.set(cx + sx * spacingX * 0.375, 1.15, cz + 0.3);
        roomGrp.add(side);
      }
      /* Monitor */
      const monBase = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.12), M.body());
      monBase.position.set(cx, 0.78, cz - 0.25); roomGrp.add(monBase);
      const monPost = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.25,8), M.metal());
      monPost.position.set(cx, 0.9, cz - 0.25); roomGrp.add(monPost);
      const monScreen = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.35,0.03), M.monitorFrame());
      monScreen.position.set(cx, 1.2, cz - 0.25); roomGrp.add(monScreen);
      const monDisplay = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.3), M.monitorScreen());
      monDisplay.position.set(cx, 1.2, cz - 0.23); roomGrp.add(monDisplay);
      /* Keyboard */
      const kbd = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.15), M.body());
      kbd.position.set(cx, 0.79, cz - 0.05); roomGrp.add(kbd);
      /* Chair */
      const chair = new THREE.Group();
      const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.5), M.chair());
      seat.position.y = 0.45; chair.add(seat);
      const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.06), M.chairBack());
      back.position.set(0, 0.75, 0.25); chair.add(back);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.35,10), M.gray());
      post.position.y = 0.22; chair.add(post);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.04,16), M.gray());
      base.position.y = 0.03; chair.add(base);
      chair.position.set(cx, 0, cz + 1.2);
      roomGrp.add(chair);
    }
  }

  /* --- SUPERVISOR DESKS (back wall) --- */
  const superCount = Math.max(2, Math.min(5, Math.floor(W / 6)));
  const superSpacingX = (W * 0.5) / Math.max(1, superCount - 1);
  for (let i=0;i<superCount;i++) {
    const cx = -W*0.25 + i * superSpacingX;
    const cz = hd - 3;
    /* Supervisor desk */
    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.07, 1.4), M.deskTop());
    desk.position.set(cx, 0.78, cz); desk.castShadow = true; roomGrp.add(desk);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.04, 1.5), M.deskEdge());
    edge.position.set(cx, 0.74, cz); roomGrp.add(edge);
    for (const dx of [-1.1, 1.1]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.74, 1.3), M.gray());
      leg.position.set(cx + dx, 0.37, cz); roomGrp.add(leg);
    }
    /* Dual monitors */
    for (let m=0;m<2;m++) {
      const mx = cx - 0.32 + m*0.64;
      const monBase = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.12), M.body());
      monBase.position.set(mx, 0.8, cz - 0.3); roomGrp.add(monBase);
      const monPost = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.3,8), M.metal());
      monPost.position.set(mx, 0.95, cz - 0.3); roomGrp.add(monPost);
      const monScreen = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.32,0.03), M.monitorFrame());
      monScreen.position.set(mx, 1.28, cz - 0.3); roomGrp.add(monScreen);
      const monDisplay = new THREE.Mesh(new THREE.PlaneGeometry(0.45,0.28), M.monitorScreen());
      monDisplay.position.set(mx, 1.28, cz - 0.28); roomGrp.add(monDisplay);
    }
    /* Chair */
    const chair = new THREE.Group();
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.08, 0.55), M.chair());
    seat.position.y = 0.45; chair.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.07), M.chairBack());
    back.position.set(0, 0.78, 0.27); chair.add(back);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.35,10), M.gray());
    post.position.y = 0.22; chair.add(post);
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.05,16), M.gray());
    base.position.y = 0.03; chair.add(base);
    chair.position.set(cx, 0, cz + 1.3);
    roomGrp.add(chair);
  }

  /* --- RECORDING BOOTH (front-left) --- */
  const recW = Math.min(6, W * 0.25);
  const recD = Math.min(3, D * 0.18);
  const recX = -hw + recW/2 + 1;
  const recZ = -hd + recD/2 + 1;
  const recBody = new THREE.Mesh(new THREE.BoxGeometry(recW, 2.6, recD), M.wall());
  recBody.position.set(recX, 1.3, recZ); recBody.castShadow = true; roomGrp.add(recBody);
  const recRoof = new THREE.Mesh(new THREE.BoxGeometry(recW + 0.3, 0.2, recD + 0.3), M.ceiling());
  recRoof.position.set(recX, 2.7, recZ); roomGrp.add(recRoof);
  /* Glass window */
  const recGlass = new THREE.Mesh(new THREE.PlaneGeometry(recW - 1.5, 1.4), M.boothGlass());
  recGlass.position.set(recX, 1.5, recZ + recD/2 + 0.01); roomGrp.add(recGlass);
  /* "REC" sign */
  const recSign = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.5), M.ledRed());
  recSign.position.set(recX, 2.4, recZ + recD/2 + 0.02); roomGrp.add(recSign);
  /* Door */
  const recDoor = new THREE.Mesh(new THREE.BoxGeometry(0.85, 2.1, 0.06), M.door());
  recDoor.position.set(recX + recW/2 - 0.6, 1.05, recZ + recD/2 + 0.04); roomGrp.add(recDoor);

  /* --- MEETING ROOM (front-right) --- */
  const meetW = Math.min(5, W * 0.2);
  const meetD = Math.min(3.5, D * 0.2);
  const meetX = hw - meetW/2 - 1;
  const meetZ = -hd + meetD/2 + 1;
  const meetBody = new THREE.Mesh(new THREE.BoxGeometry(meetW, 2.6, meetD), M.wall());
  meetBody.position.set(meetX, 1.3, meetZ); meetBody.castShadow = true; roomGrp.add(meetBody);
  const meetRoof = new THREE.Mesh(new THREE.BoxGeometry(meetW + 0.3, 0.2, meetD + 0.3), M.ceiling());
  meetRoof.position.set(meetX, 2.7, meetZ); roomGrp.add(meetRoof);
  const meetGlass = new THREE.Mesh(new THREE.PlaneGeometry(meetW - 1.2, 1.6), M.boothGlass());
  meetGlass.position.set(meetX - meetW/2 - 0.01, 1.5, meetZ);
  meetGlass.rotation.y = Math.PI/2; roomGrp.add(meetGlass);

  /* --- KPI WALL DISPLAY --- */
  const kpiW = Math.min(6, W * 0.25);
  const kpiFrame = new THREE.Mesh(new THREE.BoxGeometry(kpiW, 1.5, 0.1), M.monitorFrame());
  kpiFrame.position.set(0, H - 1, -hd + 0.06); roomGrp.add(kpiFrame);
  const kpiScreen = new THREE.Mesh(new THREE.PlaneGeometry(kpiW - 0.2, 1.3), M.monitorScreen());
  kpiScreen.position.set(0, H - 1, -hd + 0.12); roomGrp.add(kpiScreen);
  /* KPI bars */
  const nKpi = 6;
  for (let i=0;i<nKpi;i++) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(kpiW/nKpi - 0.15, 0.3 + (i%3)*0.2, 0.02),
      [*M.ledGreen(), M.ledTeal(), M.ledAm10ber(), M.ledCyan(), M.led)/Lime(), M.ledTeal()][10i]);
    bar.position.set(-kpiW/2 + 0.4 + i*(kpiW/nKpi), H - 1.6 + (0.3 + (i%3)*0.2)/2, -hd + 0.13);
    roomGrp.add(bar);
  }

  /* --- DOORS --- */
  const doorPositions = [
    { x:-hw + 0.05, z:0, ry:Math.PI/2 },
    { x: hw - 0.05, z:0, ry:-Math.PI/2 },
    { x:0, z: hd - 0.05, ry:Math.PI }
  ];
  for (const dp of doorPositions) {
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.35, 2.5, 0.1), M.doorFrame());
    frame.position.set(dp.x, 1.25, dp.z);
    frame.rotation.y = dp.ry; roomGrp.add(frame);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.4, 0.06), M.door());
    door.position.set(dp.x, 1.2, dp.z);
    door.rotation.y = dp.ry; roomGrp.add(door);
    /* Exit sign */
    const exitSign = new THREE.Mesh(new THREE.PlaneGeometry(0.,6, 0.3), z M.ledGreen());
    exitSign.position.set(dp.x, 2.7, dp.z);
    exitSign.rotation.y = dp.ry; roomGrp.add(exitSign);
  }
}

const meshById = new Map();

}
function updateSelectionVisuals() {
  devGrp.children.forEach(m => {

/* ============ HEATMAP ============ */
let heatMesh = null;
function disposeHeat() {
  if (heatMesh) { heatGrp.remove(heatMesh); heatMesh.geometry.dispose(); heatMesh.material.dispose(); heatMesh = null; }
}
function buildHeatmap() {
  disposeHeat();
  if (!state.showHeat) return;
  const speakers = state.devices.filter(d =>
    ['agentDesk','supervisor','ceilingSpk','masking','paging','emergency'].includes(d.cat)
  );
  if (!speakers.length) {
    document.getElementById('hudSpl').textContent = '—';
    document.getElementById('hudCoverage').textContent = '0%';
    return;
  }
  const SIZE = Math.max(ROOM.size[0], ROOM.size[1]) * 1.15;
  const RES = 70;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);
  geo.rotateX(-Math.PI/2);
  const colors = new Float32Array(geo.attributes.position.count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  heatMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.5,
    depthWrite: false, side: THREE.DoubleSide
  }));
  heatMesh.position.y = 0.15;
  heatMesh.renderOrder = 1;
  heatGrp.add(heatMesh);
  updateHeatColors();
}
function calcSPL(x, z) {
  let tot = 0;
  for (const spk of state.devices) {
    if (!['agentDesk','supervisor','ceilingSpk','masking','paging','emergency'].includes(spk.cat)) continue;
    const spec = getSpec(spk.cat, spk.typeId);
    if (!spec || !spec.power) continue;
    const power = spk.power || spec.power;
    const dx = x - spk.x, dz = z - spk.z;
    const dy = -spec.h;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (d < 0.5) continue;
    const s1m = 88 + 10 * Math.log10(Math.max(power,1));
    let dl = 0;
    if (spec.dir) {
      const facing = spk.rot || 0;
      const tl = Math.atan2(dx, dz);
      let a = Math.abs(facing - tl);
      if (a > Math.PI) a = 2*Math.PI - a;
      dl = -11 * (1 - Math.cos(a));
    }
    const dL = -20 * Math.log10(d);
    const v = s1m + dL + dl;
    if (v < -20) continue;
    tot += Math.pow(10, v/10);
  }
  return tot > 0 ? 10 * Math.log10(tot) : 0;
}
const SPL_STOPS = [
  [40,0.05,0.10,0.45],[50,0.00,0.30,0.80],[58,0.00,0.65,0.95],
  [65,0.00,0.90,0.90],[72,0.30,0.90,0.45],[80,0.85,0.90,0.25],
  [88,1.00,0.65,0.15],[95,1.00,0.25,0.10],[105,0.85,0.05,0.15]
];
function splRGB(v) {
  const S = SPL_STOPS, N = S.length;
  if (v <= S[0][0]) return [S[0][1],S[0][2],S[0][3]];
  if (v >= S[N-1][0]) return [S[N-1][1],S[N-1][2],S[N-1][3]];
  for (let i=0;i<N-1;i++) {
    const a=S[i], b=S[i+1];
    if (v>=a[0] && v<=b[0]) {
      const t = (v-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t];
    }
  }
  return [1,1,1];
}
function updateHeatColors() {
  if (!heatMesh) return;
  const pos = heatMesh.geometry.attributes.position;
  const col = heatMesh.geometry.attributes.color;
  let mx = 0, covered = 0;
  const total = pos.count;
  for (let i=0;i<total;i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const v = calcSPL(x, z);
    if (v > mx) mx = v;
    if (v >= 55) covered++;
    const c = splRGB(v);
    col.setXYZ(i, c[0], c[1], c[2]);
  }
  col.needsUpdate = true;
  document.getElementById('hudSpl').textContent = mx > 0 ? mx.toFixed(0) + ' dB' : '—';
  const covPct = total > 0 ? Math.round((covered/total)*100) : 0;
  document.getElementById('hudCoverage').textContent = covPct + '%';
  const statSpl = document.getElementById('statSpl');
  const statCov = document.getElementById('statCov');
  statSpl.classList.remove('good','warn');
  statCov.classList.remove('good','warn');
  if (mx >= 45 && mx <= 70) statSpl.classList.add('good');
  else if (mx > 0) statSpl.classList.add('warn');
  if (covPct >= 70) statCov.classList.add('good');
  else if (covPct >= 45) statCov.classList.add('warn');
}

/* ============ HISTORY ============ */
function serialize() {
  return JSON.stringify(state.devices.map(d => ({
    id:d.id, brand:d.brand, cat:d.cat, typeId:d.typeId,
    x:d.x, z:d.z, rot:d.rot, power:d.power
  })));
}
function pushHistory() {
  state.history = state.history.slice(0, state.historyIdx + 1);
  state.history.push(serialize());
  state.historyIdx = state.history.length - 1;
}
function applyHistory(json) {
  state.devices = JSON.parse(json);
  state.nextId = state.devices.length ? Math.max(...state.devices.map(d=>d.id))+1 : 1;
  buildDevices(); buildHeatmap(); updateHUD(); deselect();
}
function undo() {
  if (state.historyIdx > 0) { state.historyIdx--; applyHistory(state.history[state.historyIdx]); toast(T('to_undo')); }
}
function redo() {
  if (state.historyIdx < state.history.length - 1) { state.historyIdx++; applyHistory(state.history[state.historyIdx]); toast(T('to_redo')); }
}

/* ============ CAMERA ============ */
function updateCamera() {
  const {theta, phi, radius, target} = state.cam;
  const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  const y = target.y + radius * Math.cos(phi);
  const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x, Math.max(y, 0.5), z);
  camera.lookAt(target);
}
function tweenCamera(to, dur) {
  const from = {theta: state.cam.theta, phi: state.cam.phi, radius: state.cam.radius, target: state.cam.target.clone()};
  state.cam.tween = {from, to, dur, start:performance.now()};
}
function updateTween() {
  const t = state.cam.tween; if (!t) return;
  const p = Math.min(1, (performance.now() - t.start) / t.dur);
  const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
  state.cam.theta = t.from.theta + (t.to.theta - t.from.theta) * e;
  state.cam.phi = t.from.phi + (t.to.phi - t.from.phi) * e;
  state.cam.radius = t.from.radius + (t.to.radius - t.from.radius) * e;
  state.cam.target.lerpVectors(t.from.target, t.to.target, e);
  updateCamera();
  if (p >= 1) state.cam.tween = null;
}
function setView3D(on) {
  state.view3D = on;
  const btn = document.getElementById('viewBtn');
  btn.textContent = on ? '✏️ 2D' : '🎬 3D';
  btn.classList.toggle('on', !on);
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 1.5;
  if (on) tweenCamera({theta:-0.5, phi:0.9, radius:r, target:new THREE.Vector3(0,1.5,0)}, 900);
  else tweenCamera({theta:0, phi:0.02, radius:r, target:new THREE.Vector3(0,0,0)}, 900);
}
function fitView() {
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 1.5;
  if (state.view3D) tweenCamera({theta:-0.5, phi:0.9, radius:r, target:new THREE.Vector3(0,1.5,0)}, 700);
  else tweenCamera({theta:0, phi:0.02, radius:r, target:new THREE.Vector3(0,0,0)}, 700);
}
function camTopView() {
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 1.5;
  tweenCamera({theta:0, phi:0.02, radius:r, target:new THREE.Vector3(0,0,0)}, 800);
}
function camAgentView() {
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 0.55;
  /* Agent perspective: from one desk looking toward the back of the room */
  tweenCamera({theta:-0.3, phi:1.25, radius:r, target:new THREE.Vector3(0, 1.4, ROOM.size[1] * 0.15)}, 800);
}

/* ============ INTERACTION ============ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const activePointers = new Map();
let isDown = false, moved = false, dragDev = null;
let dragOff = {x:0, z:0};
let startPt = {x:0, y:0};
let pinchStart = null;

function canvasPos(cx, cy) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((cx - r.left) / r.width) * 2 - 1;
  pointer.y = -((cy - r.top) / r.height) * 2 + 1;
}
function hitDevice(cx, cy) {
  canvasPos(cx, cy);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(devGrp.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && o.userData.devId === undefined) o = o.parent;
    if (o) return o;
  }
  return null;
}
const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function floorPoint(cx, cy) {
  canvasPos(cx, cy);
  raycaster.setFromCamera(pointer, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(floorPlane, p) ? p : null;
}

canvas.addEventListener('pointerdown', e => {
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (activePointers.size === 1) {
    startPt = {x:e.clientX, y:e.clientY};
    isDown = true; moved = false; dragDev = null;
    const hit = hitDevice(e.clientX, e.clientY);
    if (hit) {
      dragDev = hit;
      const fp = floorPoint(e.clientX, e.clientY);
      if (fp) { dragOff.x = hit.userData.dev.x - fp.x; dragOff.z = hit.userData.dev.z - fp.z; }
    }
  } else if (activePointers.size === 2) {
    dragDev = null; isDown = false; moved = true;
    const pts = [...activePointers.values()];
    pinchStart = {dist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1, radius: state.cam.radius};
  }
}, {passive:true});

canvas.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  const prev = activePointers.get(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (activePointers.size === 2 && pinchStart) {
    const pts = [...activePointers.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    state.cam.radius = Math.max(8, Math.min(180, pinchStart.radius * (pinchStart.dist/d)));
    state.cam.tween = null; updateCamera(); return;
  }
  if (!isDown) return;
  const dx = e.clientX - prev.x;
  const dy = e.clientY - prev.y;
  if (Math.abs(e.clientX-startPt.x) + Math.abs(e.clientY-startPt.y) > 6) moved = true;
  if (dragDev && moved) {
    const fp = floorPoint(e.clientX, e.clientY);
    if (fp) {
      const d = dragDev.userData.dev;
      d.x = Math.round((fp.x + dragOff.x)*10)/10;
      d.z = Math.round((fp.z + dragOff.z)*10)/10;
      dragDev.position.set(d.x, dragDev.userData.spec.h, d.z);
      if (state.showHeat) updateHeatColors();
      updateInfo();
    }
  } else if (!dragDev && moved && !state.presentation) {
    if (state.view3D) {
      state.cam.tween = null;
      state.cam.theta -= dx * 0.008;
      state.cam.phi = Math.max(0.12, Math.min(1.5, state.cam.phi + dy * 0.008));
      updateCamera();
    } else {
      state.cam.tween = null;
      const ps = state.cam.radius * 0.0018;
      state.cam.target.x -= (dx*Math.cos(state.cam.theta) - dy*Math.sin(state.cam.theta)) * ps;
      state.cam.target.z -= (dx*Math.sin(state.cam.theta) + dy*Math.cos(state.cam.theta)) * ps;
      updateCamera();
    }
  }
}, {passive:true});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) {
    if (isDown && !moved && !state.presentation) {
      const hit = hitDevice(e.clientX, e.clientY);
      if (hit) select(hit.userData.devId);
      else if (state.selected !== null) deselect();
      else {
        const fp = floorPoint(e.clientX, e.clientY);
        if (fp) { placeDevice(fp.x, fp.z); pushHistory(); }
      }
    }
    isDown = false; dragDev = null; moved = false; pinchStart = null;
  } else {
    pinchStart = null; isDown = false; dragDev = null; moved = true;
  }
}
canvas.addEventListener('pointerup', endPointer, {passive:true});
canvas.addEventListener('pointercancel', endPointer, {passive:true});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam.tween = null;
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  state.cam.radius = Math.max(8, Math.min(180, state.cam.radius * factor));
  updateCamera();
}, {passive:false});

/* ============ ACTIONS ============ */
function placeDevice(x, z) {
  const spec = getSpec(state.curCat, state.curType); if (!spec) return;
  const d = {id: state.nextId++, brand: state.curBrand, cat: state.curCat, typeId: state.curType,
    x: Math.round(x: Math.round(z*10)/10, rot: 0, power: spec.power};
  state.devices.push(d);
  buildDevices();
  if (state.showHeat) buildHeatmap();
  updateHUD();
  toast(spec.emoji + ' ' + devName(spec));
}
function select(id) {
  state.selected = id;
  updateSelectionVisuals(); updateInfo();
  document.getElementById('info').classList.add('on');
}
function deselect() {
  state.selected = null;
  updateSelectionVisuals();
  document.getElementById('info').classList.remove('on');
}
function deleteSelected() {
  if (state.selected === null) return;
  state.devices = state.devices.filter(d => d.id !== state.selected);
  state.selected = null;
  document.getElementById('info').classList.remove('on');
  buildDevices(); buildHeatmap(); updateHUD(); pushHistory();
  toast(T('to_deleted'));
}
function updateInfo() {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected); if (!d) return;
  const spec = getSpec(d.cat, d.typeId); if (!spec) return;
  document.getElementById('infName').textContent = spec.emoji + ' ' + devName(spec);
  document.getElementById('infBrand').textContent = brandName(d.brand);
  document.getElementById('infType').textContent = catName(d.cat);
  document.getElementById('infPower').textContent = spec.power > 0 ? (d.power||spec.power) + ' W' : '—';
  document.getElementById('infH').textContent = spec.h.toFixed(1) + (LANG==='ar'?' م':' m');
  document.getElementById('infPos').textContent = d.x.toFixed(1) + ', ' + d.z.toFixed(1);
  const pw = document.getElementById('powerSlider');
  pw.value = d.power || spec.power;
  document.getElementById('powerVal').textContent = (d.power||spec.power) + 'W';
  document.getElementById('powerWrap').style.display = spec.power > 0 ? 'flex' : 'none';
  const rs = document.getElementById('rotSlider');
  const deg = Math.round((d.rot||0) * 180 / Math.PI);
  rs.value = deg;
  document.getElementById('rotVal').textContent = deg + '°';
  document.getElementById('rotWrap').style.display = spec.dir ? 'flex' : 'none';
}

/* ============ RESIZE ROOM ============ */
function resizeRoom(newW, newD) {
  const oldW = ROOM.size[0], oldD = ROOM.size[1];
  ROOM.size[0] = newW;
  ROOM.size[1] = newD;
  const sx = newW / oldW, sz = newD / oldD;
  for (const d of state.devices) {
    d.x = Math.round(d.x * sx * 10)/10;
    d.z = Math.round(d.z * sz * 10)/10;
  }
  buildRoom();
  buildDevices();
  if (state.showHeat) buildHeatmap();
  fitView();
  document.getElementById('roomWSlider').value = newW;
  document.getElementById('roomDSlider').value = newD;
  document.getElementById('roomWVal').textContent = newW + 'm';
  document.getElementById('roomDVal').textContent = newD + 'm';
  document.querySelectorAll('.presetBtns button').forEach(b => b.classList.remove('on'));
  if (newW === 16 && newD === 12) document.querySelector('[data-preset="small"]').classList.add('on');
  else if (newW === 26 && newD === 18) document.querySelector('[data-preset="medium"]').classList.add('on');
  else if (newW === 40 && newD === 26) document.querySelector('[data-preset="large"]').classList.add('on');
  toast(T('to_resized'));
  pushHistory();
}

    el.appendChild(b);

}
function buildBrands() {
  const el = document.getElementById('brands'); el.innerHTML = '';

    const b = document.createElement('button');

}

}

function toast(m) {
  const el = document.getElementById('toast');

  clearTimeout(toastTO);

function loadInitialDevices() {
  state.devices = []; state.nextId = 1; state.selected = null;

    const [brand, cat, typeId, x, z, rot] = item;

document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      state.devices = (data.devices||[]).map(d => ({
        id: d.id,
        brand: BRANDS[d.brand] ? d.brand : 'jabra',
        cat: CATS[d.cat] ? d.cat : 'agentHeadset',
        typeId: d.typeId,
        x:+d.x||0, z:+d.z||0, rot:+d.rot||0, power:+d.power||0
      })).filter(d => getSpec(d.cat, d.typeId));
      state.nextId = state.devices.length ? Math.max(...state.devices.map(d=>d.id))+1 : 1;
      if (data.roomSize && data.roomSize.length === 2) {
        ROOM.size[0] = data.roomSize[0];
        ROOM.size[1] = data.roomSize[1];
        document.getElementById('roomWSlider').value = ROOM.size[0];
        document.getElementById('roomDSlider').value = ROOM.size[1];
        document.getElementById('roomWVal').textContent = ROOM.size[0] + 'm';
        document.getElementById('roomDVal').textContent = ROOM.size[1] + 'm';
      }
      buildRoom(); buildDevices(); buildHeatmap(); updateHUD(); fitView();
      state.history = [serialize()]; state.historyIdx = 0;
      toast(T('to_loaded'));
    } catch(err) { alert(T('to_invalid')); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

document.getElementById('powerSlider').oninput = e => {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected); if (!d) return;
  d.power = parseInt(e.target.value,10) || 0;
  document.getElementById('powerVal').textContent = d.power + 'W';
  document.getElementById('infPower').textContent = d.power + ' W';
  if (state.showHeat) updateHeatColors();
};
document.getElementById('powerSlider').onchange = () => pushHistory();
document.getElementById('rotSlider').oninput = e => {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected); if (!d) return;
  d.rot = parseInt(e.target.value,10) * Math.PI / 180;
  const m = meshById.get(d.id);
  if (m) m.rotation.y = d.rot;
  document.getElementById('rotVal').textContent = e.target.value + '°';
  if (state.showHeat) updateHeatColors();
};
document.getElementById('rotSlider').onchange = () => pushHistory();

/* Dimension controls */
document.getElementById('roomWSlider').oninput = e => {
  document.getElementById('roomWVal').textContent = e.target.value + 'm';
};
document.getElementById('roomDSlider').oninput = e => {
  document.getElementById('roomDVal').textContent = e.target.value + 'm';
};
document.getElementById('roomWSlider').onchange = e => {
  resizeRoom(parseInt(e.target.value,10), ROOM.size[1]);
};
document.getElementById('roomDSlider').onchange = e => {
  resizeRoom(ROOM.size[0], parseInt(e.target.value,10));
};
document.querySelectorAll('.presetBtns button').forEach(btn => {
  btn.onclick = () => {
    const p = btn.dataset.preset;
    if (p === 'small')  resizeRoom(16, 12);
    if (p === 'medium') resizeRoom(26, 18);
    if (p === 'large')  resizeRoom(40, 26);
  };
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (e.key === 'Escape') { deselect(); document.getElementById('reportModal').classList.remove('on'); }
  else if (e.key === 'Tab') { e.preventDefault(); setView3D(!state.view3D); }
});

/* ============ RESIZE ============ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

/* ============ LOOP & INIT ============ */
function animate() {
  requestAnimationFrame(animate);
  updateTween();
  const t = performance.now() * 0.003;
  devGrp.children.forEach(m => {
    const r = m.getObjectByName('selRing');
    if (r && r.material.opacity > 0) r.scale.setScalar(1 + Math.sin(t) * 0.08);
  });
  renderer.render(scene, camera);
}

function init() {
  applyLang();
  buildCats(); buildBrands(); buildTypes();
  loadInitialDevices();
  onResize();
  updateCamera();
  animate();
  setTimeout(() => document.getElementById('loader').classList.add('off'), 600);
  console.log('%c✅ AURALIS · Call Center ready · Agents · Supervisors · Recording',
    'color:#14b8a6;font-weight:bold;font-size:14px');
}

init();
</script>
