<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>🏢 AURALIS · Corporate Office</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1e;--panel:rgba(16,26,44,.94);--card:rgba(30,45,75,.7);
  --line:rgba(180,220,255,.1);--line2:rgba(59,130,246,.4);
  --txt:#eef5ff;--txt2:#a8bedc;--txt3:#6b80a0;
  --vio:#9b7bff;--cyn:#4de5ff;--mint:#4fe4b8;--amb:#ffc94d;--rose:#ff7a9c;
  --corp:#3b82f6;--corp2:#1e40af;--accent:#60a5fa;--silver:#94a3b8;
  --sh:0 8px 32px rgba(0,0,0,.7);--font:'Cairo','Inter',sans-serif;
}
html[lang="en"]{--font:'Inter','Cairo',sans-serif}
html[lang="en"] body{font-family:var(--font)}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:14px;user-select:none;-webkit-user-select:none}

#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}

#loader{position:fixed;inset:0;z-index:9999;background:
  radial-gradient(circle at 50% 40%,rgba(59,130,246,.2),transparent 60%),#0a0f1e;
  display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#loader.off{opacity:0;visibility:hidden}
#loader .box{text-align:center}
#loader .sym{font-size:70px;filter:drop-shadow(0 0 40px rgba(59,130,246,.8));
  animation:pulse 1.6s ease-in-out infinite}
#loader .txt{margin-top:14px;color:var(--txt2);letter-spacing:3.5px;font-size:12px;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.7}}

header{position:fixed;top:0;left:0;right:0;min-height:56px;z-index:100;padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  transition:transform .4s cubic-bezier(.4,0,.2,1)}
header.hide{transform:translateY(-110%)}
.logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--corp),var(--corp2));display:grid;place-items:center;
  font-size:20px;color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.55);
  border:1px solid rgba(180,220,255,.2)}
.title{display:flex;flex-direction:column;gap:1px;min-width:0}
.title .t1{font-size:14px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#fff,var(--corp));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  white-space:nowrap}
.title .t2{font-size:9.5px;color:var(--txt3);letter-spacing:1.2px;
  font-family:'JetBrains Mono',monospace;white-space:nowrap}
.spacer{flex:1}
.langBtn{height:38px;min-width:50px;padding:0 12px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;flex-shrink:0}
.langBtn:hover{border-color:var(--corp);color:var(--corp)}
.langBtn:active{transform:scale(.95)}
.langBtn .flag{font-size:15px}
.btn{height:38px;min-width:38px;padding:0 12px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:13px;
  font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:6px;transition:transform .15s;flex-shrink:0}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.94)}
.btn.on{background:linear-gradient(135deg,var(--corp),var(--corp2));color:#fff;border-color:transparent}

.hud{position:fixed;top:76px;inset-inline-end:12px;z-index:50;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;transition:opacity .3s}
.hud .stat{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);
  padding:7px 13px;border-radius:11px;font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--txt2);text-align:center;min-width:82px;
  transition:border-color .3s}
.hud .stat b{color:var(--cyn);font-weight:700;font-size:13px;display:block;margin-top:2px}
.hud .stat.good b{color:var(--mint)}
.hud .stat.warn b{color:var(--amb)}

.tools{position:fixed;inset-inline-end:12px;bottom:185px;z-index:60;
  display:flex;flex-direction:column;gap:8px;transition:transform .4s,opacity .3s}
.tools.hide{transform:translateX(-160%);opacity:0}
.tool{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:blur(20px);color:var(--txt);
  font-size:20px;cursor:pointer;display:grid;place-items:center;
  box-shadow:var(--sh);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.tool:hover{border-color:var(--line2);transform:translateY(-2px)}
.tool:active{transform:scale(.92)}
.tool.on{background:linear-gradient(135deg,var(--corp),var(--corp2));
  border-color:transparent;color:#fff;box-shadow:0 8px 24px rgba(59,130,246,.55)}

.info{position:fixed;top:76px;inset-inline-start:12px;z-index:70;width:250px;
  padding:15px;border-radius:16px;background:var(--panel);
  backdrop-filter:blur(24px);border:1px solid var(--line2);box-shadow:var(--sh);
  transform:translateX(calc(-100% - 30px));opacity:0;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;max-height:calc(100vh - 210px);overflow-y:auto}
.info.on{transform:translateX(0);opacity:1;pointer-events:auto}
.info h4{font-size:13px;font-weight:800;margin-bottom:3px;color:var(--corp);
  display:flex;align-items:center;gap:7px}
.info .tag{font-size:9.5px;color:var(--txt3);margin-bottom:11px;
  font-family:'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase}
.info .row{display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;font-size:11px;border-bottom:1px dashed var(--line)}
.info .row:last-of-type{border:none}
.info .row span:first-child{color:var(--txt3)}
.info .row span:last-child{color:var(--txt);font-weight:700;
  font-family:'JetBrains Mono',monospace}
.info .slider{margin-top:8px;display:flex;align-items:center;gap:7px}
.info .slider label{font-size:10px;color:var(--txt3);min-width:48px}
.info .slider input{flex:1;-webkit-appearance:none;appearance:none;height:3px;
  border-radius:2px;background:rgba(255,255,255,.12);outline:none}
.info .slider input::-webkit-slider-thumb{-webkit-appearance:none;
  width:14px;height:14px;border-radius:50%;background:var(--corp);
  box-shadow:0 0 8px rgba(59,130,246,.7);cursor:pointer}
.info .slider b{font-size:10px;color:var(--corp);
  font-family:'JetBrains Mono',monospace;min-width:42px;text-align:end}
.info .numInput{width:64px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:6px;padding:3px 6px;font-family:inherit;font-size:11px}
.info .actions{display:flex;gap:6px;margin-top:12px}
.info .actions button{flex:1;padding:9px;border-radius:10px;font-family:inherit;
  font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--line);
  background:var(--card);color:var(--txt);transition:all .2s}
.info .actions button:hover{background:rgba(255,255,255,.05)}
.info .actions button.del{background:rgba(255,122,156,.15);color:var(--rose);
  border-color:rgba(255,122,156,.4)}

.picker{position:fixed;bottom:0;left:0;right:0;z-index:80;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
  background:var(--panel);backdrop-filter:blur(24px);
  border-top:1px solid var(--line);
  transition:transform .4s cubic-bezier(.4,0,.2,1)}
.picker.hide{transform:translateY(110%)}
.cats,.brands{display:flex;gap:6px;margin-bottom:7px;overflow-x:auto;
  scrollbar-width:none;padding-bottom:1px}
.cats::-webkit-scrollbar,.brands::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:10px;flex-shrink:0;background:var(--card);
  border:1.5px solid transparent;color:var(--txt2);font-family:inherit;
  font-size:11.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat.on{background:linear-gradient(135deg,var(--corp),var(--corp2));color:#fff;
  box-shadow:0 4px 12px rgba(59,130,246,.5)}
.brand{padding:6px 12px;border-radius:9px;flex-shrink:0;background:var(--card);
  border:1px solid transparent;color:var(--txt2);font-family:inherit;font-size:11px;
  font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.brand.on{border-color:var(--accent);color:var(--accent);background:rgba(96,165,250,.12)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;
  max-height:120px;overflow-y:auto;scrollbar-width:thin;padding:1px}
.types::-webkit-scrollbar{width:4px}
.types::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.type{padding:8px 4px;border-radius:10px;background:var(--card);
  border:1.5px solid transparent;color:var(--txt2);font-family:inherit;
  font-size:9.5px;font-weight:700;cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.type:hover{border-color:var(--line2)}
.type:active{transform:scale(.94)}
.type.on{background:linear-gradient(135deg,var(--corp),var(--corp2));color:#fff;
  box-shadow:0 5px 16px rgba(59,130,246,.5)}
.type .em{font-size:20px;line-height:1}
.type .nm{font-size:9px;line-height:1.2;text-align:center}

.toast{position:fixed;bottom:195px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:11px 22px;border-radius:14px;background:var(--panel);
  backdrop-filter:blur(20px);border:1px solid var(--line2);
  font-size:13px;font-weight:700;color:var(--txt);opacity:0;pointer-events:none;
  transition:all .3s;z-index:200;white-space:nowrap;
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.presBtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  z-index:90;padding:13px 26px;border-radius:30px;
  background:linear-gradient(135deg,var(--corp),var(--corp2));
  color:#fff;font-family:inherit;font-size:13px;font-weight:800;
  border:0;cursor:pointer;display:none;
  box-shadow:0 12px 40px rgba(59,130,246,.55)}
.presBtn.on{display:block;animation:showB .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes showB{from{transform:translateX(-50%) scale(.5);opacity:0}}
.exitP{position:fixed;top:calc(22px + env(safe-area-inset-top,0));
  inset-inline-end:22px;z-index:100;width:46px;height:46px;border-radius:50%;
  background:rgba(20,26,42,.85);backdrop-filter:blur(20px);
  border:1px solid var(--line);color:var(--txt);font-size:20px;cursor:pointer;
  display:none;place-items:center;transition:all .2s}
.exitP.on{display:grid}
.exitP:active{transform:scale(.9)}

.modal{position:fixed;inset:0;background:rgba(5,15,30,.92);backdrop-filter:blur(10px);
  z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal-content{background:#0f1f3a;border:1px solid var(--line2);border-radius:20px;
  width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.85);overflow:hidden;
  animation:slideUp .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px;
  background:rgba(24,42,72,.8)}
.modal-header h3{color:var(--corp);font-size:15px;font-weight:800;
  display:flex;align-items:center;gap:9px}
.modal-body{padding:22px;overflow-y:auto;font-size:13px;line-height:1.65}
.report-section{margin-bottom:20px}
.report-section:last-child{margin-bottom:0}
.report-section h4{color:var(--accent);font-size:14px;margin-bottom:10px;
  border-bottom:1px solid var(--line);padding-bottom:6px;
  display:flex;align-items:center;gap:8px}
.modal-body .row{display:flex;justify-content:space-between;gap:12px;
  padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
.modal-body .row:last-child{border:none}
.modal-body .row span:first-child{color:var(--txt3)}
.modal-body .row span:last-child{font-weight:700;
  font-family:'JetBrains Mono',monospace}
.report-table{width:100%;border-collapse:collapse;margin-top:10px;
  border-radius:10px;overflow:hidden}
.report-table th,.report-table td{border:1px solid var(--line);
  padding:10px 12px;text-align:start;font-size:12px}
.report-table th{background:rgba(59,130,246,.22);color:#bfdbfe;font-weight:800}
.report-table tr:nth-child(even) td{background:rgba(180,220,255,.02)}
.modal-footer{padding:16px 20px;border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

@media (max-width:600px){
  .title .t2{display:none}
  .langBtn .label{display:none}
  .langBtn{min-width:42px;padding:0 10px}
  .btn{padding:0 9px;font-size:12px}
  .info{width:220px}
  .tool{width:44px;height:44px;font-size:18px}
  .types{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
}
@media print{
  body{background:#fff;color:#000;position:static}
  header,.tools,.hud,.picker,.presBtn,.exitP,.info,#c,.toast,#loader{display:none!important}
  .modal{position:absolute;inset:0;background:#fff;padding:0;display:block!important}
  .modal-content{border:none;box-shadow:none;max-height:none;width:100%;
    color:#000;background:#fff;animation:none}
  .modal-header{background:none;border-bottom:2px solid #000}
  .modal-header h3{color:#000}
  .modal-footer{display:none}
  .modal-body .row span:first-child{color:#555}
  .report-section h4{color:#000}
  .report-table th{background:#eee;color:#000}
  .report-table th,.report-table td{border:1px solid #999}
}
</style>
</head>
<body>

<div id="loader"><div class="box">
  <div class="sym">🏢</div>
  <div class="txt" id="loaderTxt">LOADING OFFICE…</div>
</div></div>

<canvas id="c"></canvas>

<header id="hd">
  <div class="logo">🏢</div>
  <div class="title">
    <div class="t1">AURALIS</div>
    <div class="t2" id="roomLabel">CORPORATE OFFICE · AV + PAGING</div>
  </div>
  <div class="spacer"></div>
  <button class="langBtn" id="langBtn" title="Language">
    <span class="flag">🌐</span>
    <span class="label" id="langLabel">EN</span>
  </button>
  <button class="btn" id="reportBtn" data-i18n-title="report_tip">📄</button>
  <button class="btn" id="viewBtn">🎬 3D</button>
  <button class="btn" id="shotBtn" data-i18n-title="shot_tip">📸</button>
  <button class="btn" id="presBtn" data-i18n-title="pres_tip">🎥</button>
</header>

<div class="hud" id="hud">
  <div class="stat" id="statDev">
    <span data-i18n="hud_devices">Devices</span>
    <b id="hudCount">0</b>
  </div>
  <div class="stat" id="statSpl">
    <span data-i18n="hud_spl">Max SPL</span>
    <b id="hudSpl">—</b>
  </div>
  <div class="stat" id="statCov">
    <span data-i18n="hud_coverage">Coverage</span>
    <b id="hudCoverage">—</b>
  </div>
</div>

<div class="tools" id="tools">
  <button class="tool on" id="heatBtn" data-i18n-title="heat_tip">🌡️</button>
  <button class="tool" id="fitBtn" data-i18n-title="fit_tip">🎯</button>
  <button class="tool on" id="gridBtn" data-i18n-title="grid_tip">▦</button>
  <button class="tool" id="saveBtn" data-i18n-title="save_tip">💾</button>
  <button class="tool" id="loadBtn" data-i18n-title="load_tip">📂</button>
  <button class="tool" id="clearBtn" data-i18n-title="clear_tip">🧹</button>
</div>

<input type="file" id="fileInput" style="display:none" accept=".json">

<div class="info" id="info">
  <h4>📦 <span id="infName">—</span></h4>
  <div class="tag" id="infBrand">—</div>
  <div class="row"><span data-i18n="inf_category">Category</span><span id="infType">—</span></div>
  <div class="row"><span data-i18n="inf_power">Power</span><span id="infPower">—</span></div>
  <div class="row"><span data-i18n="inf_height">Height</span><span id="infH">—</span></div>
  <div class="row"><span data-i18n="inf_position">Position</span><span id="infPos">—</span></div>
  <div class="slider" id="powerWrap">
    <label data-i18n="sl_power">Power</label>
    <input type="range" id="powerSlider" min="5" max="500" step="5" value="20">
    <b id="powerVal">20W</b>
  </div>
  <div class="slider" id="rotWrap">
    <label data-i18n="sl_rotation">Rotation</label>
    <input type="range" id="rotSlider" min="-180" max="180" step="5" value="0">
    <b id="rotVal">0°</b>
  </div>
  <div class="row" style="margin-top:8px">
    <span data-i18n="inf_room_w">Width</span>
    <input type="number" id="roomWInput" class="numInput" min="4" max="200">
  </div>
  <div class="row">
    <span data-i18n="inf_room_d">Depth</span>
    <input type="number" id="roomDInput" class="numInput" min="4" max="200">
  </div>
  <div class="actions">
    <button class="del" id="delBtn" data-i18n="act_delete">🗑️ Delete</button>
  </div>
</div>

<div class="picker" id="picker">
  <div class="cats" id="cats"></div>
  <div class="brands" id="brands"></div>
  <div class="types" id="types"></div>
</div>

<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📋 <span data-i18n="rep_title">Acoustic Design Report</span></h3>
      <button class="btn" id="closeModalBtn" style="height:32px;min-width:32px;padding:0 8px">✕</button>
    </div>
    <div class="modal-body" id="reportModalBody"></div>
    <div class="modal-footer">
      <button class="btn on" id="printReportBtn" data-i18n="rep_print">🖨️ Print / Save PDF</button>
      <button class="btn" id="closeModalBtn2" data-i18n="rep_close">Close</button>
    </div>
  </div>
</div>

<button class="presBtn" id="presToggle" data-i18n="pres_start">🎥 Start Presentation</button>
<button class="exitP" id="exitPres">✕</button>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';

/* ============ I18N ============ */
const I18N = {
  ar: {
    loader:'جارٍ تحميل المكتب…',
    room_label:'مكتب احترافي · AV + نداء',
    hud_devices:'الأجهزة', hud_spl:'أقصى SPL', hud_coverage:'التغطية',
    report_tip:'تقرير', shot_tip:'لقطة', pres_tip:'عرض',
    heat_tip:'خريطة حرارية', fit_tip:'ملاءمة', grid_tip:'الشبكة',
    save_tip:'حفظ', load_tip:'فتح', clear_tip:'حذف الكل',
    inf_category:'الفئة', inf_power:'القوة', inf_height:'الارتفاع',
    inf_position:'الموقع', inf_room_w:'العرض', inf_room_d:'الطول',
    sl_power:'القوة', sl_rotation:'الاتجاه', act_delete:'🗑️ حذف',
    rep_title:'التقرير الهندسي الصوتي',
    rep_print:'🖨️ طباعة / حفظ PDF', rep_close:'إغلاق',
    pres_start:'🎥 بدء العرض',
    cat_reception:'الاستقبال', cat_open:'المساحة المفتوحة',
    cat_meeting:'قاعات الاجتماعات', cat_exec:'مكتب تنفيذي',
    cat_corridor:'الممرات + نداء', cat_mics:'ميكروفونات',
    cat_video:'فيديو مؤتمرات', cat_amps:'مضخمات', cat_control:'تحكم',
    dev_ceil:'سماعة سقفية', dev_ceil_prem:'سماعة سقفية فخمة',
    dev_pendant:'معلّقة', dev_wall:'جدارية', dev_column:'عمودية',
    dev_meeting:'سماعة اجتماعات', dev_conf:'سماعة مؤتمرات',

function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.body.style.fontFamily = LANG === 'ar'
    ? "'Cairo','Inter',sans-serif" : "'Inter','Cairo',sans-serif";
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (I18N[LANG][k]) el.textContent = I18N[LANG][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.dataset.i18nTitle;
    if (I18N[LANG][k]) el.title = I18N[LANG][k];
  });
  document.getElementById('langLabel').textContent = LANG === 'ar' ? 'EN' : 'ع';
  document.getElementById('loaderTxt').textContent = T('loader');
  document.getElementById('roomLabel').textContent = T('room_label');
  document.getElementById('presToggle').textContent = T('pres_start');

}

function getSpec(cat, typeId) {
  const c = CATS[cat]; if (!c) return null;
  const arr = c.devices.find(d => d[0] === typeId); if (!arr) return null;
  return {id:arr[0], nameKey:arr[1], emoji:arr[2], h:arr[3], power:arr[4], dir:arr[5], shape:arr[6]};
}

/* ============ MESH FACTORY ============ */
function makeMesh(cat, typeId, brandColor) {
  const spec = getSpec(cat, typeId);
  if (!spec) return null;
  const color = brandColor || 0x4de5ff;
  const g = new THREE.Group();
  const S = spec.shape;

  switch (S) {
    case 'ceilDisc': {
      const d = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.03,28), M.body());
      d.castShadow = true; g.add(d);
      const gr = new THREE.Mesh(new THREE.CircleGeometry(0.12,28), M.dark());
      gr.rotation.x = Math.PI/2; gr.position.y = -0.017; g.add(gr);
      const r = new THREE.Mesh(new THREE.RingGeometry(0.12,0.16,28),
        new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.85, side:THREE.DoubleSide}));
      r.rotation.x = -Math.PI/2; r.position.y = -0.018; g.add(r);
      break;
    }
    case 'ceilPremium': {
      const d = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,0.035,32), M.body());
      d.castShadow = true; g.add(d);
      const gr = new THREE.Mesh(new THREE.CircleGeometry(0.15,32), M.dark());
      gr.rotation.x = Math.PI/2; gr.position.y = -0.02; g.add(gr);
      const tw = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.012,16), accentMat(color, 1.5));
      tw.rotation.x = Math.PI/2; tw.position.y = -0.026; g.add(tw);
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.13,0.17,32), M.metal());
      ring.rotation.x = -Math.PI/2; ring.position.y = -0.021; g.add(ring);
      break;
    }
    case 'pendantSpk': {
      const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.6,6), M.gray());
      cable.position.y = 0.4; g.add(cable);
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.18,20), M.body());
      body.castShadow = true; g.add(body);

/* ============ BUILD ROOM ============ */
function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0]; g.remove(c);
    c.traverse?.(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
  }
}

function buildRoom() {
  clearGroup(roomGrp);
  const H = 3.2, T = 0.25;

  /* Walls */
  for (const wall of ROOM.walls) {
    const [x1,z1,x2,z2] = wall;
    const dx = x2-x1, dz = z2-z1;
    const len = Math.hypot(dx,dz);
    const ang = Math.atan2(dz,dx);
    const w = new THREE.Mesh(new THREE.BoxGeometry(len,H,T), M.wall());
    w.position.set((x1+x2)/2, H/2, (z1+z2)/2);
    w.rotation.y = -ang;
    w.castShadow = true; w.receiveShadow = true;
    roomGrp.add(w);
  }

  /* Ceiling */
  const ceil = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM.size[0], 0.15, ROOM.size[1]),
    new THREE.MeshStandardMaterial({color:0xf8f8fa, roughness:0.9})
  );
  ceil.position.y = H - 0.075; roomGrp.add(ceil);

  /* Ceiling LED panels */
  for (const px of [-7, -3, 1, 5, 9]) {
    for (const pz of [-5, -1, 3, 6]) {
      const panel = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.04, 0.6),
        M.lightPanel()
      );
      panel.position.set(px, H - 0.14, pz); roomGrp.add(panel);
    }
  }

  /* Ambient light */
  scene.add(new THREE.PointLight(0xffffff, 0.3, 12, 2));
  for (const px of [-5, 0, 5]) {
    for (const pz of [-4, 0, 4]) {
      const pl = new THREE.PointLight(0xffffff, 0.25, 8, 2);
      pl.position.set(px, H - 0.3, pz); roomGrp.add(pl);
    }
  }

  for (const f of ROOM.features) {
    /* === FLOOR === */
    if (f.type === 'floor') {
      const fl = new THREE.Mesh(
        new THREE.BoxGeometry(f.w, 0.03, f.d),
        M.floor()
      );
      fl.position.set(f.x, 0.015, f.z); fl.receiveShadow = true; roomGrp.add(fl);
      /* Carpet in open space */
      const carpet = new THREE.Mesh(
        new THREE.BoxGeometry(14, 0.02, 10),
        M.carpet()
      );
      carpet.position.set(0, 0.025, 1); carpet.receiveShadow = true; roomGrp.add(carpet);
    }

    /* === GLASS PARTITIONS === */
    if (f.type === 'glassWall') {
      const isVertical = f.w < f.d;
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(f.w, f.h, f.d),
        M.glass()
      );
      glass.position.set(f.x, f.h/2, f.z); roomGrp.add(glass);
      /* Metal frame */
      if (isVertical) {
        const top = new THREE.Mesh(new THREE.BoxGeometry(f.w + 0.05, 0.06, f.d + 0.05), M.metal());
        top.position.set(f.x, f.h, f.z); roomGrp.add(top);
        const bot = new THREE.Mesh(new THREE.BoxGeometry(f.w + 0.05, 0.06, f.d + 0.05), M.metal());
        bot.position.set(f.x, 0.03, f.z); roomGrp.add(bot);
        /* Vertical mullions */
        const count = Math.floor(f.d / 1.5);
        for (let i=1;i<count;i++) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.06, f.h, 0.06), M.metal());
          m.position.set(f.x, f.h/2, f.z - f.d/2 + i*(f.d/count)); roomGrp.add(m);
        }
      } else {
        const top = new THREE.Mesh(new THREE.BoxGeometry(f.w + 0.05, 0.06, f.d + 0.05), M.metal());
        top.position.set(f.x, f.h, f.z); roomGrp.add(top);
        const bot = new THREE.Mesh(new THREE.BoxGeometry(f.w + 0.05, 0.06, f.d + 0.05), M.metal());
        bot.position.set(f.x, 0.03, f.z); roomGrp.add(bot);
        const count = Math.floor(f.w / 1.5);
        for (let i=1;i<count;i++) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.06, f.h, 0.06), M.metal());
          m.position.set(f.x - f.w/2 + i*(f.w/count), f.h/2, f.z); roomGrp.add(m);
        }
      }
    }

    /* === RECEPTION DESK === */
    if (f.type === 'receptionDesk') {
      const desk = new THREE.Mesh(
        new THREE.BoxGeometry(f.w, 1.1, f.d),
        M.woodDark()
      );
      desk.position.set(f.x, 0.55, f.z); desk.castShadow = true; roomGrp.add(desk);
      /* Marble top */
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(f.w + 0.15, 0.08, f.d + 0.1),
        M.marble()
      );
      top.position.set(f.x, 1.14, f.z); roomGrp.add(top);
      /* Company logo (emissive) */
      const logo = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.15, 0.02),
        new THREE.MeshStandardMaterial({color:0x3b82f6, emissive:0x3b82f6, emissiveIntensity:0.7, roughness:0.4, metalness:0.5})
      );
      logo.position.set(f.x, 1.5, f.z); roomGrp.add(logo);
      /* Receptionist chair */
      const chairSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.08,16), M.chairBlue());
      chairSeat.position.set(f.x, 0.5, f.z + 1); roomGrp.add(chairSeat);
      const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.5,0.08), M.chairBlue());
      chairBack.position.set(f.x, 0.8, f.z + 1.15); roomGrp.add(chairBack);
      const chairPost = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.4,8), M.metal());
      chairPost.position.set(f.x, 0.25, f.z + 1); roomGrp.add(chairPost);
    }

    /* === OPEN DESKS === */
    if (f.type === 'openDesks') {
      const rowGap = f.d / f.rows;
      const colGap = f.w / f.cols;
      for (let r=0;r<f.rows;r++) {
        for (let c=0;c<f.cols;c++) {
          const dx = f.x - f.w/2 + (c + 0.5) * colGap;
          const dz = f.z - f.d/2 + (r + 0.5) * rowGap;
          /* Desk top */
          const top = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.05, 0.7),
            M.deskTop()
          );
          top.position.set(dx, 0.72, dz); top.receiveShadow = true; roomGrp.add(top);
          /* Legs */
          for (const lx of [-0.7, 0.7]) {
            for (const lz of [-0.3, 0.3]) {
              const leg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.05), M.deskLeg());
              leg.position.set(dx + lx, 0.35, dz + lz); roomGrp.add(leg);
            }
          }
          /* Monitor */
          const monitor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 0.03), M.body());
          monitor.position.set(dx, 1.05, dz - 0.1); roomGrp.add(monitor);
          const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.28), M.screen());
          screen.position.set(dx, 1.05, dz - 0.084); roomGrp.add(screen);
          /* Monitor stand */
          const stand = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.28,0.06), M.metal());
          stand.position.set(dx, 0.86, dz - 0.1); roomGrp.add(stand);
          /* Keyboard */
          const kb = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.02,0.15), M.body());
          kb.position.set(dx, 0.76, dz + 0.15); roomGrp.add(kb);
          /* Office chair */
          const chairSeat = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.06,16), M.chair());
          chairSeat.position.set(dx, 0.48, dz + 0.75); roomGrp.add(chairSeat);
          const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.5,0.06), M.chair());
          chairBack.position.set(dx, 0.75, dz + 0.95); roomGrp.add(chairBack);
          const chairPost = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,8), M.metal());

    /* === MEETING TABLES === */

      /* Chairs around table */

      for (let i=0;i<chairsPerSide;i++) {
        for (const zOffset of [-f.d/2 - 0.3, f.d/2 + 0.3]) {

          const cz = f.z + zOffset;
          const seat = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.08,0.44), M.chair());
          seat.position.set(cx, 0.48, cz); roomGrp.add(seat);
          const back = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.5,0.06), M.chair());
          const backZ = zOffset > 0 ? cz + 0.2 : cz - 0.2;
          back.position.set(cx, 0.75, backZ); roomGrp.add(back);
          for (const lx of [-0.16, 0.16]) {
            for (const lz of [-0.16, 0.16]) {
              const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,0.48,6), M.metal());
              leg.position.set(cx + lx, 0.24, cz + lz); roomGrp.add(leg);

      /* Conference speaker in center */
      const spk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.03, 20), M.body());

      const spkLed = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.09, 20), M.ledBlue());
      spkLed.rotation.x = -Math.PI/2; spkLed.position.set(f.x, 0.812, f.z); roomGrp.add(spkLed);
    }

    /* === EXECUTIVE DESK === */
    if (f.type === 'execDesk') {
      const desk = new THREE.Mesh(
        new THREE.BoxGeometry(f.w, 0.75, f.d),
        M.woodDark()
      );
      desk.position.set(f.x, 0.375, f.z); desk.castShadow = true; roomGrp.add(desk);
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(f.w + 0.1, 0.06, f.d + 0.1),
        M.wood()
      );
      top.position.set(f.x, 0.78, f.z); roomGrp.add(top);
      /* Chair */
      const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.1,0.55), M.chair());
      chairSeat.position.set(f.x, 0.5, f.z + 1); roomGrp.add(chairSeat);
      const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.8,0.1), M.chair());
      chairBack.position.set(f.x, 0.95, f.z + 1.3); roomGrp.add(chairBack);
      /* Laptop */
      const laptopBase = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.02,0.3), M.metal());
      laptopBase.position.set(f.x, 0.82, f.z); roomGrp.add(laptopBase);
      const laptopScreen = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.28,0.02), M.body());
      laptopScreen.rotation.x = -0.2;
      laptopScreen.position.set(f.x, 0.96, f.z - 0.14); roomGrp.add(laptopScreen);
    }

    /* === CORRIDOR STRIP === */
    if (f.type === 'corridorStrip') {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(f.w, 0.025, f.d),
        new THREE.MeshStandardMaterial({color:0x1a2540, roughness:0.9})

      strip.position.set(f.x, 0.022, f.z); roomGrp.add(strip);

    /* === PLANT === */

      );
      pot.position.set(f.x, 0.3, f.z); pot.castShadow = true; roomGrp.add(pot);
      const soil = new THREE.Mesh(new THREE.CircleGeometry(f.r*0.65, 14), M.dark());
      soil.rotation.x = -Math.PI/2; soil.position.set(f.x, 0.6, f.z); roomGrp.add(soil);
      for (let i=0;i<6;i++) {

          new THREE.SphereGeometry(f.r * (0.55 + Math.random()*0.3), 12, 10),
          M.plant()
        );
        s.position.set(
          f.x + (Math.random()-0.5)*f.r,
          0.7 + Math.random()*f.r*1.4,
          f.z + (Math.random()-0.5)*f.r
        );
        s.castShadow = true; roomGrp.add(s);
      }
    }
  }
}

const meshById = new Map();

function buildDevices() {

}

function updateSelectionVisuals() {
  devGrp.children.forEach(m => {

/* ============ HEATMAP ============ */
let heatMesh = null;
function disposeHeat() {
  if (heatMesh) {
    heatGrp.remove(heatMesh);
    heatMesh.geometry.dispose();
    heatMesh.material.dispose();
    heatMesh = null;
  }
}
function buildHeatmap() {
  disposeHeat();
  if (!state.showHeat) return;
  const speakers = state.devices.filter(d =>
    d.cat === 'reception' || d.cat === 'open' || d.cat === 'meeting' ||
    d.cat === 'exec' || d.cat === 'corridor'
  );
  if (!speakers.length) {
    document.getElementById('hudSpl').textContent = '—';
    document.getElementById('hudCoverage').textContent = '0%';
    return;
  }
  const SIZE = Math.max(ROOM.size[0], ROOM.size[1]) * 1.2;
  const RES = 60;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, RES, RES);
  geo.rotateX(-Math.PI/2);
  const colors = new Float32Array(geo.attributes.position.count * 3);
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  heatMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.5,
    depthWrite: false, side: THREE.DoubleSide
  }));
  heatMesh.position.y = 0.05;
  heatMesh.renderOrder = 1;
  heatGrp.add(heatMesh);
  updateHeatColors();
}
function calcSPL(x, z) {
  let tot = 0;
  for (const spk of state.devices) {
    if (spk.cat !== 'reception' && spk.cat !== 'open' && spk.cat !== 'meeting' &&
        spk.cat !== 'exec' && spk.cat !== 'corridor') continue;
    const spec = getSpec(spk.cat, spk.typeId);
    if (!spec || !spec.power) continue;
    const power = spk.power || spec.power;
    const dx = x - spk.x, dz = z - spk.z;
    const dy = -spec.h;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (d < 0.2) continue;
    const s1m = 82 + 10 * Math.log10(Math.max(power,1));
    let dl = 0;
    if (spec.dir) {
      const facing = spk.rot || 0;
      const tl = Math.atan2(dx, dz);
      let a = Math.abs(facing - tl);
      if (a > Math.PI) a = 2*Math.PI - a;
      dl = -11 * (1 - Math.cos(a));
    }
    const dL = -20 * Math.log10(d);
    const v = s1m + dL + dl;
    if (v < -20) continue;
    tot += Math.pow(10, v/10);
  }
  return tot > 0 ? 10 * Math.log10(tot) : 0;
}
const SPL_STOPS = [
  [40,0.05,0.10,0.45],[52,0.00,0.30,0.80],[60,0.00,0.65,0.95],
  [68,0.00,0.90,0.90],[74,0.30,0.90,0.45],[80,0.85,0.90,0.25],
  [86,1.00,0.65,0.15],[92,1.00,0.25,0.10],[100,0.85,0.05,0.15]
];
function splRGB(v) {
  const S = SPL_STOPS, N = S.length;
  if (v <= S[0][0]) return [S[0][1],S[0][2],S[0][3]];
  if (v >= S[N-1][0]) return [S[N-1][1],S[N-1][2],S[N-1][3]];
  for (let i=0;i<N-1;i++) {
    const a=S[i], b=S[i+1];
    if (v>=a[0] && v<=b[0]) {
      const t = (v-a[0])/(b[0]-a[0]);
      return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
    }
  }
  return [1,1,1];
}
function updateHeatColors() {
  if (!heatMesh) return;
  const pos = heatMesh.geometry.attributes.position;
  const col = heatMesh.geometry.attributes.color;
  let mx = 0, covered = 0;
  const total = pos.count;
  for (let i=0;i<total;i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const v = calcSPL(x, z);
    if (v > mx) mx = v;
    if (v >= 60) covered++;
    const c = splRGB(v);
    col.setXYZ(i, c[0], c[1], c[2]);
  }
  col.needsUpdate = true;
  document.getElementById('hudSpl').textContent = mx > 0 ? mx.toFixed(0) + ' dB' : '—';
  const covPct = total > 0 ? Math.round((covered/total)*100) : 0;
  document.getElementById('hudCoverage').textContent = covPct + '%';
  const statSpl = document.getElementById('statSpl');
  const statCov = document.getElementById('statCov');
  statSpl.classList.remove('good','warn');
  statCov.classList.remove('good','warn');
  /* Office target: 60-75 dB ambient */
  if (mx >= 55 && mx <= 80) statSpl.classList.add('good');
  else if (mx > 0) statSpl.classList.add('warn');
  if (covPct >= 85) statCov.classList.add('good');
  else if (covPct >= 60) statCov.classList.add('warn');
}

/* ============ HISTORY ============ */
function serialize() {
  return JSON.stringify(state.devices.map(d => ({
    id:d.id, brand:d.brand, cat:d.cat, typeId:d.typeId,
    x:d.x, z:d.z, rot:d.rot, power:d.power
  })));
}
function pushHistory() {
  state.history = state.history.slice(0, state.historyIdx + 1);
  state.history.push(serialize());
  state.historyIdx = state.history.length - 1;
}
function applyHistory(json) {
  state.devices = JSON.parse(json);
  state.nextId = state.devices.length ? Math.max(...state.devices.map(d=>d.id))+1 : 1;
  buildDevices(); buildHeatmap(); updateHUD(); deselect();
}
function undo() {
  if (state.historyIdx > 0) {
    state.historyIdx--;
    applyHistory(state.history[state.historyIdx]);
    toast(T('to_undo'));
  }
}
function redo() {
  if (state.historyIdx < state.history.length - 1) {
    state.historyIdx++;
    applyHistory(state.history[state.historyIdx]);
    toast(T('to_redo'));
  }
}

/* ============ CAMERA ============ */
function updateCamera() {
  const {theta, phi, radius, target} = state.cam;
  const x = target.x + radius * Math.sin(phi) * Math.sin(theta);
  const y = target.y + radius * Math.cos(phi);
  const z = target.z + radius * Math.sin(phi) * Math.cos(theta);
  camera.position.set(x, Math.max(y, 0.5), z);
  camera.lookAt(target);
}
function tweenCamera(to, dur) {
  const from = {
    theta: state.cam.theta, phi: state.cam.phi,
    radius: state.cam.radius, target: state.cam.target.clone()
  };
  state.cam.tween = {from, to, dur, start:performance.now()};
}
function updateTween() {
  const t = state.cam.tween;
  if (!t) return;
  const p = Math.min(1, (performance.now() - t.start) / t.dur);
  const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
  state.cam.theta = t.from.theta + (t.to.theta - t.from.theta) * e;
  state.cam.phi = t.from.phi + (t.to.phi - t.from.phi) * e;
  state.cam.radius = t.from.radius + (t.to.radius - t.from.radius) * e;
  state.cam.target.lerpVectors(t.from.target, t.to.target, e);
  updateCamera();
  if (p >= 1) state.cam.tween = null;
}
function setView3D(on) {
  state.view3D = on;
  const btn = document.getElementById('viewBtn');
  btn.textContent = on ? '✏️ 2D' : '🎬 3D';
  btn.classList.toggle('on', !on);
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 1.35;
  if (on) tweenCamera({theta:-0.4, phi:0.9, radius:r, target:new THREE.Vector3(0,1.5,0)}, 900);
  else tweenCamera({theta:0, phi:0.02, radius:r, target:new THREE.Vector3(0,0,0)}, 900);
}
function fitView() {
  const r = Math.max(ROOM.size[0], ROOM.size[1]) * 1.35;
  if (state.view3D) tweenCamera({theta:-0.4, phi:0.9, radius:r, target:new THREE.Vector3(0,1.5,0)}, 700);
  else tweenCamera({theta:0, phi:0.02, radius:r, target:new THREE.Vector3(0,0,0)}, 700);
}

/* ============ INTERACTION ============ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const activePointers = new Map();
let isDown = false, moved = false, dragDev = null;
let dragOff = {x:0, z:0};
let startPt = {x:0, y:0};
let pinchStart = null;

function canvasPos(cx, cy) {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((cx - r.left) / r.width) * 2 - 1;
  pointer.y = -((cy - r.top) / r.height) * 2 + 1;
}
function hitDevice(cx, cy) {
  canvasPos(cx, cy);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(devGrp.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && o.userData.devId === undefined) o = o.parent;
    if (o) return o;
  }
  return null;
}
const floorPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function floorPoint(cx, cy) {
  canvasPos(cx, cy);
  raycaster.setFromCamera(pointer, camera);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(floorPlane, p) ? p : null;
}

canvas.addEventListener('pointerdown', e => {
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (activePointers.size === 1) {
    startPt = {x:e.clientX, y:e.clientY};
    isDown = true; moved = false; dragDev = null;
    const hit = hitDevice(e.clientX, e.clientY);
    if (hit) {
      dragDev = hit;
      const fp = floorPoint(e.clientX, e.clientY);
      if (fp) {
        dragOff.x = hit.userData.dev.x - fp.x;
        dragOff.z = hit.userData.dev.z - fp.z;
      }
    }
  } else if (activePointers.size === 2) {
    dragDev = null; isDown = false; moved = true;
    const pts = [...activePointers.values()];
    pinchStart = {
      dist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1,
      radius: state.cam.radius
    };
  }
}, {passive:true});

canvas.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  const prev = activePointers.get(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (activePointers.size === 2 && pinchStart) {
    const pts = [...activePointers.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    state.cam.radius = Math.max(3, Math.min(120, pinchStart.radius * (pinchStart.dist/d)));
    state.cam.tween = null;
    updateCamera();
    return;
  }
  if (!isDown) return;
  const dx = e.clientX - prev.x;
  const dy = e.clientY - prev.y;
  if (Math.abs(e.clientX-startPt.x) + Math.abs(e.clientY-startPt.y) > 6) moved = true;

  if (dragDev && moved) {
    const fp = floorPoint(e.clientX, e.clientY);
    if (fp) {
      const d = dragDev.userData.dev;
      d.x = Math.round((fp.x + dragOff.x)*10)/10;
      d.z = Math.round((fp.z + dragOff.z)*10)/10;
      dragDev.position.set(d.x, dragDev.userData.spec.h, d.z);
      if (state.showHeat) updateHeatColors();
      updateInfo();
    }
  } else if (!dragDev && moved && !state.presentation) {
    if (state.view3D) {
      state.cam.tween = null;
      state.cam.theta -= dx * 0.008;
      state.cam.phi = Math.max(0.12, Math.min(1.52, state.cam.phi + dy * 0.008));
      updateCamera();
    } else {
      state.cam.tween = null;
      const ps = state.cam.radius * 0.0018;
      state.cam.target.x -= (dx*Math.cos(state.cam.theta) - dy*Math.sin(state.cam.theta)) * ps;
      state.cam.target.z -= (dx*Math.sin(state.cam.theta) + dy*Math.cos(state.cam.theta)) * ps;
      updateCamera();
    }
  }
}, {passive:true});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) {
    if (isDown && !moved && !state.presentation) {
      const hit = hitDevice(e.clientX, e.clientY);
      if (hit) select(hit.userData.devId);
      else if (state.selected !== null) deselect();
      else {
        const fp = floorPoint(e.clientX, e.clientY);
        if (fp) { placeDevice(fp.x, fp.z); pushHistory(); }
      }
    }
    isDown = false; dragDev = null; moved = false; pinchStart = null;
  } else {
    pinchStart = null; isDown = false; dragDev = null; moved = true;
  }
}
canvas.addEventListener('pointerup', endPointer, {passive:true});
canvas.addEventListener('pointercancel', endPointer, {passive:true});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.cam.tween = null;
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  state.cam.radius = Math.max(3, Math.min(120, state.cam.radius * factor));
  updateCamera();
}, {passive:false});

/* ============ ACTIONS ============ */
function placeDevice(x, z) {
  const spec = getSpec(state.curCat, state.curType);
  if (!spec) return;
  const d = {
    id: state.nextId++, brand: state.curBrand, cat: state.curCat, typeId: state.curType,
    x: Math.round(x*10)/10, z: Math.round(z*10)/10,
    rot: 0, power: spec.power
  };
  state.devices.push(d);
  buildDevices();
  if (state.showHeat) buildHeatmap();
  updateHUD();
  toast(spec.emoji + ' ' + devName(spec));
}
function select(id) {
  state.selected = id;
  updateSelectionVisuals();
  updateInfo();
  document.getElementById('info').classList.add('on');
}
function deselect() {
  state.selected = null;
  updateSelectionVisuals();
  document.getElementById('info').classList.remove('on');
}
function deleteSelected() {
  if (state.selected === null) return;
  state.devices = state.devices.filter(d => d.id !== state.selected);
  state.selected = null;
  document.getElementById('info').classList.remove('on');
  buildDevices(); buildHeatmap(); updateHUD(); pushHistory();
  toast(T('to_deleted'));
}
function updateInfo() {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected);
  if (!d) return;
  const spec = getSpec(d.cat, d.typeId);
  if (!spec) return;
  document.getElementById('infName').textContent = spec.emoji + ' ' + devName(spec);
  document.getElementById('infBrand').textContent = brandName(d.brand);
  document.getElementById('infType').textContent = catName(d.cat);
  document.getElementById('infPower').textContent = spec.power > 0 ? (d.power||spec.power) + ' W' : '—';
  document.getElementById('infH').textContent = spec.h.toFixed(1) + (LANG==='ar'?' م':' m');
  document.getElementById('infPos').textContent = d.x.toFixed(1) + ', ' + d.z.toFixed(1);
  const pw = document.getElementById('powerSlider');
  pw.value = d.power || spec.power;
  document.getElementById('powerVal').textContent = (d.power||spec.power) + 'W';
  document.getElementById('powerWrap').style.display = spec.power > 0 ? 'flex' : 'none';
  const rs = document.getElementById('rotSlider');
  const deg = Math.round((d.rot||0) * 180 / Math.PI);
  rs.value = deg;
  document.getElementById('rotVal').textContent = deg + '°';
  document.getElementById('rotWrap').style.display = spec.dir ? 'flex' : 'none';
  document.getElementById('roomWInput').value = ROOM.size[0];
  document.getElementById('roomDInput').value = ROOM.size[1];
}

}
function buildTypes() {
  const el = document.getElementById('types'); el.innerHTML = '';
  for (const d of CATS[state.curCat].devices) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'type' + (d[0] === state.curType ? ' on' : '');
    b.dataset.typeId = d[0];
    b.innerHTML = '<span class="em">' + d[2] + '</span><span class="nm">' + T(d[1]) + '</span>';
    b.onclick = () => selectType(d[0]);
    el.appendChild(b);
  }
}
function selectCat(key) {
  state.curCat = key;
  state.curType = CATS[key].devices[0][0];
  document.querySelectorAll('.cat').forEach(b => b.classList.toggle('on', b.dataset.cat === key));
  buildTypes();
}
function selectBrand(key) {
  state.curBrand = key;
  document.querySelectorAll('.brand').forEach(b => b.classList.toggle('on', b.dataset.brand === key));
}
function selectType(id) {
  state.curType = id;
  document.querySelectorAll('.type').forEach(b => b.classList.toggle('on', b.dataset.typeId === id));
}
function updateHUD() {
  document.getElementById('hudCount').textContent = state.devices.length;
}
let toastTO;
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  clearTimeout(toastTO);
  toastTO = setTimeout(() => el.classList.remove('on'), 1700);
}
function loadInitialDevices() {
  state.devices = []; state.nextId = 1; state.selected = null;
  for (const item of ROOM.devices) {
    const [brand, cat, typeId, x, z, rot] = item;
    const spec = getSpec(cat, typeId);
    if (!spec) continue;
    state.devices.push({
      id: state.nextId++, brand, cat, typeId,
      x, z, rot: rot || 0, power: spec.power
    });
  }
  buildRoom(); buildDevices(); buildHeatmap(); updateHUD(); deselect();
  state.history = [serialize()]; state.historyIdx = 0;
}

/* ============ REPORT ============ */
function generateReport() {
  const totalPower = state.devices.reduce((a,d) => {
    const s = getSpec(d.cat, d.typeId);
    return a + (s && s.power ? (d.power || s.power) : 0);
  }, 0);

  const counts = {};
  const zoneCounts = { reception:0, open:0, meeting:0, exec:0, corridor:0 };
  state.devices.forEach(d => {
    const spec = getSpec(d.cat, d.typeId);
    if (!spec) return;
    const key = brandName(d.brand) + ' · ' + devName(spec);
    counts[key] = (counts[key] || 0) + 1;
    if (zoneCounts[d.cat] !== undefined) zoneCounts[d.cat]++;
  });

  let rows = '';
  const entries = Object.entries(counts);
  if (entries.length) {
    for (const [name, qty] of entries) rows += `<tr><td>${name}</td><td>${qty}</td></tr>`;
  } else {
    rows = `<tr><td colspan="2" style="text-align:center;color:#888">${T('rep_empty')}</td></tr>`;
  }

  const splVal = document.getElementById('hudSpl').textContent;
  const covVal = document.getElementById('hudCoverage').textContent;

  /* RT60 for office - target 0.4-0.6s (speech focused) */
  const V = ROOM.size[0] * ROOM.size[1] * 3.2;
  const S = 2 * (ROOM.size[0]*ROOM.size[1] + ROOM.size[0]*3.2 + ROOM.size[1]*3.2);
  const alpha = 0.35;
  const rt60 = (0.161 * V) / (S * alpha);
  const rt60Display = rt60.toFixed(2) + ' s';
  const reverbQuality = rt60 > 0.8 ? '⚠️ ' + (LANG==='ar'?'صدى عالٍ':'High reverb')
                       : rt60 > 0.3 ? '🎯 ' + (LANG==='ar'?'مثالي للمكاتب':'Ideal for offices')
                       : '⚡ ' + (LANG==='ar'?'جاف جداً':'Too dry)');

  /* STI */
  const cov = parseInt(covVal) || 0;
  const sti = Math.min(1, Math.max(0, (1.05 - rt60*0.5) * (0.5 + cov/180)));
  const stiDisplay = sti.toFixed(2) + ' (' + (sti > 0.75 ? (LANG==='ar'?'ممتاز':'Excellent')
                  : sti > 0.6 ? (LANG==='ar'?'جيد جداً':'Very Good')
                  : sti > 0.45 ? (LANG==='ar'?'جيد':'Good')
                  : (LANG==='ar'?'يحتاج تحسين':'Needs improvement')) + ')';

  /* Desk count */
  const desksFeature = ROOM.features.find(x => x.type === 'openDesks');
  const deskCount = desksFeature ? desksFeature.rows * desksFeature.cols : 0;

  /* Paging system */
  const hasPaging = state.devices.some(d => d.cat === 'corridor' && d.typeId === 'paging') &&
                    state.devices.some(d => d.cat === 'control' && d.typeId === 'paging_ctrl');

  /* Video conferencing */
  const hasVideo = state.devices.filter(d => d.cat === 'video').length >= 3;

  /* Zones */
  const zoneCount = [zoneCounts.reception, zoneCounts.open, zoneCounts.meeting, zoneCounts.exec, zoneCounts.corridor]
    .filter(c => c > 0).length;

  document.getElementById('reportModalBody').innerHTML = `
    <div class="report-section">
      <h4>📍 ${T('rep_env_info')}</h4>
      <div class="row"><span>${T('rep_env_type')}</span><span>${ROOM.name[LANG]}</span></div>
      <div class="row"><span>${T('rep_dim')}</span><span>${ROOM.size[0]}m × ${ROOM.size[1]}m × 3.2m</span></div>
      <div class="row"><span>${T('rep_desks')}</span><span>${deskCount} ${LANG==='ar'?'مكتب':'desks'}</span></div>
      <div class="row"><span>${T('rep_zones')}</span><span>${zoneCount} ${LANG==='ar'?'منطقة':'zones'}</span></div>
      <div class="row"><span>${T('rep_total_dev')}</span><span>${state.devices.length}</span></div>
      <div class="row"><span>${T('rep_total_power')}</span><span>${totalPower} Watt</span></div>
      <div class="row"><span>${T('rep_date')}</span><span>${new Date().toLocaleString(LANG==='ar'?'ar-EG':'en-US')}</span></div>
    </div>
    <div class="report-section">
      <h4>🔊 ${T('rep_equip')}</h4>
      <table class="report-table">
        <thead><tr><th>${T('rep_device')}</th><th style="width:80px;text-align:center">${T('rep_qty')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="report-section">
      <h4>📊 ${T('rep_analysis')}</h4>
      <div class="row"><span>${T('rep_max_spl')}</span><span>${splVal}</span></div>
      <div class="row"><span>${T('rep_coverage')}</span><span>${covVal}</span></div>
      <div class="row"><span>${T('rep_target')}</span><span>55–80 dB</span></div>
      <div class="row"><span>${T('rep_rt')}</span><span>${rt60Display}</span></div>
      <div class="row"><span>${T('rep_reverb')}</span><span>${reverbQuality}</span></div>
      <div class="row"><span>${T('rep_sti')}</span><span>${stiDisplay}</span></div>
      <div class="row"><span>${T('rep_paging')}</span><span style="color:${hasPaging?'#4fe4b8':'#ffc94d'}">${hasPaging ? (LANG==='ar'?'نشط (5 مناطق)':'Active (5 zones)') : (LANG==='ar'?'غير مُهيَّأ':'Not configured')}</span></div>
      <div class="row"><span>${T('rep_video')}</span><span style="color:${hasVideo?'#4fe4b8':'#ffc94d'}">${hasVideo ? (LANG==='ar'?'نشط (HD + PTZ)':'Active (HD + PTZ)') : (LANG==='ar'?'غير مُهيَّأ':'Not configured')}</span></div>
      <div class="row"><span>${T('rep_ada')}</span><span style="color:#4fe4b8">${LANG==='ar'?'مطابق':'Compliant'}</span></div>
      <div class="row"><span>${T('rep_status')}</span><span style="color:#4fe4b8">${T('rep_status_good')}</span></div>
    </div>
  `;
  document.getElementById('reportModal').classList.add('on');
}

/* ============ EVENTS ============ */
document.getElementById('langBtn').onclick = () => {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  localStorage.setItem('auralis_lang', LANG);
  applyLang();
  buildCats(); buildBrands(); buildTypes();
  if (state.selected !== null) updateInfo();
  toast(LANG === 'ar' ? '🌐 العربية' : '🌐 English');
};
document.getElementById('reportBtn').onclick = generateReport;
document.getElementById('closeModalBtn').onclick = () => document.getElementById('reportModal').classList.remove('on');
document.getElementById('closeModalBtn2').onclick = () => document.getElementById('reportModal').classList.remove('on');
document.getElementById('printReportBtn').onclick = () => window.print();

document.getElementById('saveBtn').onclick = () => {
  const data = JSON.stringify({
    app:'AURALIS', version:1, room:'office',
    devices: state.devices.map(d => ({
      id:d.id, brand:d.brand, cat:d.cat, typeId:d.typeId,
      x:d.x, z:d.z, rot:d.rot, power:d.power
    }))
  }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'auralis-office-' + Date.now() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(T('to_saved'));
};
document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      state.devices = (data.devices||[]).map(d => ({
        id: d.id,
        brand: BRANDS[d.brand] ? d.brand : 'motivity',
        cat: CATS[d.cat] ? d.cat : 'reception',
        typeId: d.typeId,
        x:+d.x||0, z:+d.z||0, rot:+d.rot||0, power:+d.power||0
      })).filter(d => getSpec(d.cat, d.typeId));
      state.nextId = state.devices.length ? Math.max(...state.devices.map(d=>d.id))+1 : 1;
      buildDevices(); buildHeatmap(); updateHUD(); fitView();
      state.history = [serialize()]; state.historyIdx = 0;
      toast(T('to_loaded'));
    } catch(err) { alert(T('to_invalid')); }
  };
  reader.readAsText(file);
  e.target.value = '';
};

document.getElementById('viewBtn').onclick = () => setView3D(!state.view3D);
document.getElementById('shotBtn').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'auralis-office-' + Date.now() + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  toast(T('to_shot'));
};
document.getElementById('presBtn').onclick = togglePres;
document.getElementById('presToggle').onclick = togglePres;
document.getElementById('exitPres').onclick = togglePres;
function togglePres() {
  state.presentation = !state.presentation;
  document.getElementById('hd').classList.toggle('hide', state.presentation);
  document.getElementById('tools').classList.toggle('hide', state.presentation);
  document.getElementById('picker').classList.toggle('hide', state.presentation);
  document.getElementById('hud').style.opacity = state.presentation ? '0' : '1';
  document.getElementById('info').classList.remove('on');
  document.getElementById('exitPres').classList.toggle('on', state.presentation);
  toast(state.presentation ? T('to_pres_on') : T('to_pres_off'));
}
document.getElementById('heatBtn').onclick = function() {
  state.showHeat = !state.showHeat;
  this.classList.toggle('on', state.showHeat);
  buildHeatmap();
  toast(state.showHeat ? T('to_heat_on') : T('to_heat_off'));
};
document.getElementById('fitBtn').onclick = fitView;
document.getElementById('gridBtn').onclick = function() {
  state.showGrid = !state.showGrid;
  this.classList.toggle('on', state.showGrid);
  grid.visible = state.showGrid;
};
document.getElementById('clearBtn').onclick = () => {
  if (!confirm(T('to_confirm_clear'))) return;
  state.devices = []; state.selected = null;
  document.getElementById('info').classList.remove('on');
  buildDevices(); buildHeatmap(); updateHUD(); pushHistory();
  toast(T('to_cleared'));
};
document.getElementById('delBtn').onclick = deleteSelected;
document.getElementById('powerSlider').oninput = e => {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected); if (!d) return;
  d.power = parseInt(e.target.value,10) || 0;
  document.getElementById('powerVal').textContent = d.power + 'W';
  document.getElementById('infPower').textContent = d.power + ' W';
  if (state.showHeat) updateHeatColors();
};
document.getElementById('powerSlider').onchange = () => pushHistory();
document.getElementById('rotSlider').oninput = e => {
  if (state.selected === null) return;
  const d = state.devices.find(x => x.id === state.selected); if (!d) return;
  d.rot = parseInt(e.target.value,10) * Math.PI / 180;
  const m = meshById.get(d.id);
  if (m) m.rotation.y = d.rot;
  document.getElementById('rotVal').textContent = e.target.value + '°';
  if (state.showHeat) updateHeatColors();
};
document.getElementById('rotSlider').onchange = () => pushHistory();
document.getElementById('roomWInput').onchange = e => {
  const v = Math.max(8, Math.min(60, parseFloat(e.target.value) || 20));
  ROOM.size[0] = v; e.target.value = v;
  buildRoom(); buildHeatmap();
};
document.getElementById('roomDInput').onchange = e => {
  const v = Math.max(8, Math.min(60, parseFloat(e.target.value) || 14));
  ROOM.size[1] = v; e.target.value = v;
  buildRoom(); buildHeatmap();
};
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); }
  else if (e.key === 'Escape') { deselect(); document.getElementById('reportModal').classList.remove('on'); }
  else if (e.key === 'Tab') { e.preventDefault(); setView3D(!state.view3D); }
});

/* ============ RESIZE ============ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

/* ============ LOOP & INIT ============ */
function animate() {
  requestAnimationFrame(animate);
  updateTween();
  const t = performance.now() * 0.003;
  devGrp.children.forEach(m => {
    const r = m.getObjectByName('selRing');
    if (r && r.material.opacity > 0) r.scale.setScalar(1 + Math.sin(t) * 0.08);
  });
  renderer.render(scene, camera);
}

function init() {
  applyLang();
  buildCats(); buildBrands(); buildTypes();
  loadInitialDevices();
  onResize();
  animate();
  setTimeout(() => document.getElementById('loader').classList.add('off'), 500);
  console.log('%c✅ AURALIS · Office ready · Corporate AV',
    'color:#3b82f6;font-weight:bold;font-size:14px');
}

init();
</script>
</body>
</html>
