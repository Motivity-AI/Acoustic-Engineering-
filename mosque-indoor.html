<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>🕌 AURALIS · Mosque Indoor</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--panel:rgba(16,22,38,.94);--card:rgba(30,40,66,.7);--line:rgba(255,255,255,.08);--line2:rgba(155,123,255,.35);--txt:#eef2ff;--txt2:#a8b0cc;--txt3:#6b7396;--vio:#9b7bff;--cyn:#4de5ff;--mint:#4fe4b8;--amb:#ffc94d;--rose:#ff7a9c;--gold:#d4af37;--sh:0 8px 32px rgba(0,0,0,.5)}
html{height:100%;overflow:hidden}
body{position:fixed;inset:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Cairo','Inter',sans-serif;font-size:14px;user-select:none;-webkit-user-select:none}
html[lang="en"] body{font-family:'Inter','Cairo',sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#loader{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 40%,rgba(155,123,255,.15),transparent 60%),#0a0e1a;display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#loader.off{opacity:0;visibility:hidden}
#loader .sym{font-size:64px;font-weight:900;color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,.6);animation:pulse 1.5s ease-in-out infinite;text-align:center}
#loader .txt{margin-top:14px;color:var(--txt2);letter-spacing:3px;font-size:12px;font-weight:700;text-align:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.7}}
header{position:fixed;top:0;left:0;right:0;min-height:56px;z-index:100;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;transition:transform .4s}
header.hide{transform:translateY(-110%)}
.logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--gold),#8a6d1f);display:grid;place-items:center;font-size:21px;color:#fff;box-shadow:0 4px 16px rgba(212,175,55,.45)}
.title{display:flex;flex-direction:column;gap:1px;min-width:0}
.title .t1{font-size:14px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--gold),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.title .t2{font-size:9.5px;color:var(--txt3);letter-spacing:1.2px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.spacer{flex:1}
.langBtn,.btn{height:38px;min-width:38px;padding:0 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,border-color .2s;flex-shrink:0}
.langBtn:hover,.btn:hover{border-color:var(--line2)}
.langBtn:active,.btn:active{transform:scale(.94)}
.btn.on{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#fff;border-color:transparent}
.hud{position:fixed;top:76px;inset-inline-end:12px;z-index:50;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.hud .stat{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);padding:6px 11px;border-radius:11px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--txt2);text-align:center;min-width:78px}
.hud .stat b{color:var(--cyn);font-weight:700;font-size:12px;display:block;margin-top:2px}
.hud .stat.good b{color:var(--mint)}.hud .stat.warn b{color:var(--amb)}.hud .stat.bad b{color:var(--rose)}
.tools{position:fixed;inset-inline-end:12px;bottom:220px;z-index:60;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;transition:transform .4s,opacity .3s}
.tools.hide{transform:translateX(-160%);opacity:0}
.tool{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(20px);color:var(--txt);font-size:17px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh);transition:all .2s}
.tool:hover{border-color:var(--line2);transform:translateY(-2px)}
.tool:active{transform:scale(.92)}
.tool.on{background:linear-gradient(135deg,var(--gold),#8a6d1f);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(212,175,55,.5)}
.tool:disabled{opacity:.35;cursor:not-allowed}
.legend{position:fixed;inset-inline-start:12px;bottom:230px;z-index:55;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--txt2);transition:opacity .3s;pointer-events:none}
.legend.hide{opacity:0}
.legend .bar{width:16px;border-radius:4px}
.legend .labels{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;font-size:8.5px;font-weight:600;min-width:32px}
.info{position:fixed;top:76px;inset-inline-start:12px;z-index:70;width:280px;padding:14px;border-radius:16px;background:var(--panel);backdrop-filter:blur(24px);border:1px solid var(--line2);box-shadow:var(--sh);transform:translateX(calc(-100% - 30px));opacity:0;transition:all .35s;pointer-events:none;max-height:calc(100vh - 250px);overflow-y:auto}
.info.on{transform:translateX(0);opacity:1;pointer-events:auto}
.info h4{font-size:13px;font-weight:800;margin-bottom:3px;color:var(--gold);display:flex;align-items:center;gap:7px}
.info .tag{font-size:9.5px;color:var(--txt3);margin-bottom:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.6px;text-transform:uppercase}
.info .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:11px;border-bottom:1px dashed var(--line)}
.info .row:last-of-type{border:none}
.info .row span:first-child{color:var(--txt3)}
.info .row span:last-child{color:var(--txt);font-weight:700;font-family:'JetBrains Mono',monospace}
.info .slider{margin-top:8px;display:flex;align-items:center;gap:7px}
.info .slider label{font-size:10px;color:var(--txt3);min-width:44px}
.info .slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none}
.info .slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.7);cursor:pointer}
.info .slider b{font-size:10px;color:var(--gold);font-family:'JetBrains Mono',monospace;min-width:44px;text-align:end}
.info .actions{display:flex;gap:6px;margin-top:12px}
.info .actions button{flex:1;padding:9px;border-radius:10px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:all .2s}
.info .actions button:hover{background:rgba(255,255,255,.05)}
.info .actions button.del{background:rgba(255,122,156,.15);color:var(--rose);border-color:rgba(255,122,156,.4)}
.info .dimRow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.info .dimRow h5{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:8px;letter-spacing:.5px}
.info .presetBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
.info .presetBtns button{padding:7px 3px;border-radius:8px;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt2);transition:all .2s}
.info .presetBtns button:hover{border-color:var(--gold);color:var(--gold)}
.info .presetBtns button.on{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#fff;border-color:transparent}
.info .accStats{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.info .accStats .r{display:flex;justify-content:space-between;font-size:10.5px;padding:4px 0;color:var(--txt2)}
.info .accStats .r b{font-family:'JetBrains Mono',monospace;color:var(--amb)}
.picker{position:fixed;bottom:0;left:0;right:0;z-index:80;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));background:var(--panel);backdrop-filter:blur(24px);border-top:1px solid var(--line);transition:transform .4s}
.picker.hide{transform:translateY(110%)}
.cats,.brands{display:flex;gap:6px;margin-bottom:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.cats::-webkit-scrollbar,.brands::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:10px;flex-shrink:0;background:var(--card);border:1.5px solid transparent;color:var(--txt2);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat.on{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#fff;box-shadow:0 4px 12px rgba(212,175,55,.4)}
.brand{padding:6px 12px;border-radius:9px;flex-shrink:0;background:var(--card);border:1px solid transparent;color:var(--txt2);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.brand.on{border-color:var(--vio);color:var(--vio);background:rgba(155,123,255,.12)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;max-height:115px;overflow-y:auto;scrollbar-width:thin;padding:1px}
.types::-webkit-scrollbar{width:4px}
.types::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.type{padding:8px 4px;border-radius:10px;background:var(--card);border:1.5px solid transparent;color:var(--txt2);font-family:inherit;font-size:9.5px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.type:hover{border-color:var(--line2)}
.type:active{transform:scale(.94)}
.type.on{background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#fff;box-shadow:0 5px 16px rgba(212,175,55,.4)}
.type .em{font-size:20px;line-height:1}
.type .nm{font-size:9px;line-height:1.2;text-align:center}
.toast{position:fixed;bottom:195px;left:50%;transform:translateX(-50%) translateY(20px);padding:11px 22px;border-radius:14px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--txt);opacity:0;pointer-events:none;transition:all .3s;z-index:200;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--rose);color:var(--rose)}
.probeTip{position:fixed;z-index:210;padding:8px 12px;border-radius:10px;background:rgba(10,14,26,.96);backdrop-filter:blur(16px);border:1px solid var(--gold);color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.6);white-space:nowrap}
.probeTip.on{opacity:1}
.probeTip b{color:var(--gold);font-size:13px}
.presBtn{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;padding:13px 26px;border-radius:30px;background:linear-gradient(135deg,var(--gold),#8a6d1f);color:#fff;font-family:inherit;font-size:13px;font-weight:800;border:0;cursor:pointer;display:none;box-shadow:0 12px 40px rgba(212,175,55,.5)}
.presBtn.on{display:block}
.exitP{position:fixed;top:calc(22px + env(safe-area-inset-top,0));inset-inline-end:22px;z-index:100;width:46px;height:46px;border-radius:50%;background:rgba(20,26,42,.85);backdrop-filter:blur(20px);border:1px solid var(--line);color:var(--txt);font-size:20px;cursor:pointer;display:none;place-items:center;transition:all .2s}
.exitP.on{display:grid}
.exitP:active{transform:scale(.9)}
.modal{position:fixed;inset:0;background:rgba(5,8,18,.85);backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.modal-content{background:#101626;border:1px solid var(--line2);border-radius:20px;width:100%;max-width:860px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.8);overflow:hidden}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,28,48,.8)}
.modal-header h3{color:var(--gold);font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.modal-body{padding:22px;overflow-y:auto;font-size:13px;line-height:1.65}
.report-section{margin-bottom:22px}
.report-section:last-child{margin-bottom:0}
.report-section h4{color:var(--amb);font-size:13.5px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;align-items:center;gap:8px}
.report-section h4 .num{background:var(--gold);color:#000;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900}
.report-section .formula{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--txt2);background:rgba(255,255,255,.03);padding:6px 10px;border-radius:6px;margin:6px 0;border-inline-start:2px solid var(--cyn)}
.modal-body .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--line)}
.modal-body .row:last-child{border:none}
.modal-body .row span:first-child{color:var(--txt3)}
.modal-body .row span:last-child{font-weight:700;font-family:'JetBrains Mono',monospace}
.modal-body .row.good span:last-child{color:var(--mint)}
.modal-body .row.warn span:last-child{color:var(--amb)}
.modal-body .row.bad span:last-child{color:var(--rose)}
.report-table{width:100%;border-collapse:collapse;margin-top:10px;border-radius:10px;overflow:hidden;font-size:12px}
.report-table th,.report-table td{border:1px solid var(--line);padding:8px 10px;text-align:start}
.report-table th{background:rgba(212,175,55,.15);color:var(--gold);font-weight:800;font-size:11px}
.report-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.report-table td.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.rec-list{list-style:none;padding:0;margin:8px 0}
.rec-list li{padding:6px 0 6px 24px;position:relative;font-size:12px;color:var(--txt2);border-bottom:1px dashed var(--line)}
.rec-list li:before{content:'▸';position:absolute;inset-inline-start:6px;color:var(--gold);font-weight:800}
.sti-badge{display:inline-block;padding:3px 10px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11px}
.sti-excellent{background:rgba(79,228,184,.2);color:var(--mint)}
.sti-good{background:rgba(77,229,255,.2);color:var(--cyn)}
.sti-fair{background:rgba(255,201,77,.2);color:var(--amb)}
.sti-poor{background:rgba(255,122,156,.2);color:var(--rose)}
.badge-ok{color:var(--mint);font-weight:800}
.badge-warn{color:var(--amb);font-weight:800}
.badge-bad{color:var(--rose);font-weight:800}
.confirm-content{max-width:380px}
@media(max-width:600px){
.title .t2{display:none}
.langBtn .label{display:none}
.info{width:260px}
.tool{width:38px;height:38px;font-size:15px}
}
@media print{
  @page{size:A4;margin:15mm}
  html,body{background:#fff!important;color:#000!important;position:static!important;inset:auto!important;width:auto!important;height:auto!important;overflow:visible!important;font-size:11pt!important}
  header,.tools,.hud,.picker,.presBtn,.exitP,.info,#c,#loader,.toast,.legend,.probeTip,.langBtn,.btn{display:none!important;visibility:hidden!important}
  .modal{position:static!important;inset:auto!important;background:#fff!important;padding:0!important;margin:0!important;display:block!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;z-index:auto!important}
  .modal:not(.on){display:none!important}
  .modal-content{border:none!important;box-shadow:none!important;border-radius:0!important;max-width:100%!important;width:100%!important;max-height:none!important;height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important;animation:none!important}
  .modal-header{background:#fff!important;border-bottom:2px solid #000!important;padding:8px 0!important}
  .modal-header h3{color:#000!important}
  .modal-header .btn{display:none!important}
  .modal-body{padding:12px 0!important;overflow:visible!important;color:#000!important;font-size:10.5pt!important;max-height:none!important}
  .modal-footer{display:none!important}
  .report-section{margin-bottom:14px!important;page-break-inside:avoid}
  .report-section h4{color:#000!important;border-bottom:1px solid #666!important;background:#f5f5f5!important;padding:4px 8px!important}
  .report-section h4 *{color:#000!important}
  .report-section h4 .num{background:#000!important;color:#fff!important}
  .report-section .formula{background:#f5f5f5!important;color:#000!important;border-color:#666!important}
  .modal-body .row{border-bottom:1px solid #ccc!important;padding:5px 0!important}
  .modal-body .row span{color:#000!important}
  .modal-body .row span:first-child{color:#333!important}
  .report-table{width:100%!important;border-collapse:collapse!important;page-break-inside:avoid}
  .report-table th,.report-table td{border:1px solid #666!important;color:#000!important;background:#fff!important;padding:6px 8px!important;font-size:10pt!important}
  .report-table th{background:#e8e8e8!important;font-weight:800!important}
  .sti-badge,.badge-ok,.badge-warn,.badge-bad{border:1px solid #333!important;background:#fff!important;color:#000!important;padding:2px 8px!important}
  .rec-list li{color:#000!important;border-bottom:1px dotted #ccc!important}
  .rec-list li:before{color:#666!important}
  svg{page-break-inside:avoid}
  svg text{fill:#000!important}
  svg line{stroke:#666!important}
}
</style>
</head>
<body>

<div id="loader"><div>
<div class="sym">ﷲ</div>
<div class="txt" id="loaderTxt">LOADING…</div>
</div></div>

<canvas id="c"></canvas>

<header id="hd">
<div class="logo">🕌</div>
<div class="title">
<div class="t1">AURALIS <span style="font-size:9px;color:var(--mint)">v3</span></div>
<div class="t2" id="roomLabel">MOSQUE INDOOR · ACOUSTIC DESIGN</div>
</div>
<div class="spacer"></div>
<button class="langBtn" id="langBtn" title="Language"><span>🌐</span><span class="label" id="langLabel">EN</span></button>
<button class="btn" id="reportBtn" data-i18n-title="report_tip">📄</button>
<button class="btn" id="viewBtn">🎬 3D</button>
<button class="btn" id="shotBtn" data-i18n-title="shot_tip">📸</button>
<button class="btn" id="presBtn" data-i18n-title="pres_tip">🎥</button>
</header>

<div class="hud" id="hud">
<div class="stat"><span data-i18n="hud_devices">Devices</span><b id="hudCount">0</b></div>
<div class="stat" id="statSpl"><span data-i18n="hud_spl">Max SPL</span><b id="hudSpl">—</b></div>
<div class="stat" id="statCov"><span data-i18n="hud_coverage">Coverage</span><b id="hudCoverage">—</b></div>
<div class="stat" id="statSti"><span data-i18n="hud_sti">STI</span><b id="hudSti">—</b></div>
</div>

<div class="legend" id="legend">
<div><div style="font-size:9px;color:var(--gold);font-weight:800;margin-bottom:4px;text-align:center">SPL</div><div class="bar" id="legendBar"></div></div>
<div class="labels" id="legendLabels"></div>
</div>

<div class="tools" id="tools">
<button class="tool on" id="heatBtn" data-i18n-title="heat_tip">🌡️</button>
<button class="tool" id="fitBtn" data-i18n-title="fit_tip">🎯</button>
<button class="tool on" id="gridBtn" data-i18n-title="grid_tip">▦</button>
<button class="tool" id="camTopBtn" data-i18n-title="cam_top">⬆️</button>
<button class="tool" id="camQiblaBtn" data-i18n-title="cam_qibla">🧭</button>
<button class="tool on" id="snapBtn" data-i18n-title="snap_tip">🎚️</button>
<button class="tool" id="undoBtn" data-i18n-title="undo_tip">↩️</button>
<button class="tool" id="redoBtn" data-i18n-title="redo_tip">↪️</button>
<button class="tool" id="dupBtn" data-i18n-title="dup_tip">📋</button>
<button class="tool" id="autoBtn" data-i18n-title="auto_tip">✨</button>
<button class="tool" id="shareBtn" data-i18n-title="share_tip">🔗</button>
<button class="tool" id="saveBtn" data-i18n-title="save_tip">💾</button>
<button class="tool" id="loadBtn" data-i18n-title="load_tip">📂</button>
<button class="tool" id="clearBtn" data-i18n-title="clear_tip">🧹</button>
</div>

<input type="file" id="fileInput" style="display:none" accept=".json">

<div class="info" id="info">
<h4>📦 <span id="infName">—</span></h4>

/* ==================== ACOUSTICS ==================== */
let _acCache = null;
function getAcoustics(){
if(_acCache) return _acCache;
const W=ROOM.size[0],D=ROOM.size[1],H=ROOM.height;
const V=W*D*H,S=2*(W*D+W*H+D*H);
const rt60={};
for(const f of BAND_FREQS){rt60[f]=(0.161*V)/(S*ABS_COEFF[f]);}
const rt60Mid=(rt60[500]+rt60[1000]+rt60[2000])/3;
const a500=ABS_COEFF[500];
const R=(S*a500)/(1-a500);
_acCache={V,S,rt60,rt60Mid,R,alphaAvg:a500};
return _acCache;
}
function invalidateAcoustics(){_acCache=null;}

function offAxisAtt(angleDeg,covDeg){
if(covDeg<=0) return 0;
const half=covDeg/2;
if(angleDeg<=half) return -6*Math.pow(angleDeg/half,2);
return -6-24*Math.min(1,(angleDeg-half)/half);
}

function splFromSpeaker(x,z,spk){
const spec=getSpec(spk.cat,spk.typeId); if(!spec||!spec.sens) return -Infinity;
const power=spk.power||spec.power||1;
const dx=x-spk.x,dz=z-spk.z,dy=-spec.h;
const r=Math.max(0.4,Math.sqrt(dx*dx+dy*dy+dz*dz));
const L1m=spec.sens+10*Math.log10(Math.max(power,0.1));
let direct=L1m-20*Math.log10(r);
if(spec.cov>0&&spec.dir){
const facing=spk.rot||0;
const fwd_x=Math.sin(facing),fwd_z=Math.cos(facing);
const len=Math.sqrt(dx*dx+dz*dz)||1;
let cosA=(dx*fwd_x+dz*fwd_z)/len;
cosA=Math.max(-1,Math.min(1,cosA));
direct+=offAxisAtt(Math.acos(cosA)*180/Math.PI,spec.cov);
}
const R=getAcoustics().R;
const rever=L1m+10*Math.log10(4/Math.max(R,1));
const total=Math.pow(10,direct/10)+Math.pow(10,rever/10);
return 10*Math.log10(Math.max(total,1e-10));
}

function calcSPL(x,z){
let tot=0;
for(const d of state.devices){
if(d.cat!=='speakers'&&d.cat!=='outdoor') continue;
const s=splFromSpeaker(x,z,d);
if(s>-100) tot+=Math.pow(10,s/10);
}
return tot>0?10*Math.log10(tot):0;
}

function calcSTI(x,z){
const ac=getAcoustics();
const bands=[500,1000,2000,4000];
const weights=[0.13,0.14,0.11,0.10];
let sumTI=0,sumW=0;
for(let i=0;i<bands.length;i++){
const f=bands[i],w=weights[i];
let direct=0,rever=0;
for(const d of state.devices){
if(d.cat!=='speakers'&&d.cat!=='outdoor') continue;
const spec=getSpec(d.cat,d.typeId);
if(!spec||!spec.sens) continue;
const power=d.power||spec.power||1;
const dx=x-d.x,dz=z-d.z,dy=-spec.h;
const r=Math.max(0.4,Math.sqrt(dx*dx+dy*dy+dz*dz));
const L1m=spec.sens+10*Math.log10(Math.max(power,0.1));
let dirDB=L1m-20*Math.log10(r);
if(spec.cov>0&&spec.dir){
const facing=d.rot||0;
const fwd_x=Math.sin(facing),fwd_z=Math.cos(facing);
const len=Math.sqrt(dx*dx+dz*dz)||1;
let cosA=(dx*fwd_x+dz*fwd_z)/len;
cosA=Math.max(-1,Math.min(1,cosA));
dirDB+=offAxisAtt(Math.acos(cosA)*180/Math.PI,spec.cov);
}
const revDB=L1m+10*Math.log10(4/Math.max(ac.R,1))-3*Math.log2(f/500);
direct+=Math.pow(10,dirDB/10);
rever+=Math.pow(10,revDB/10);
}
if(direct<=0) continue;
const D_R=10*Math.log10(direct/Math.max(rever,1e-10));
const snrEff=Math.max(-15,Math.min(15,D_R));
sumTI+=((snrEff+15)/30)*w; sumW+=w;
}
return sumW>0?sumTI/sumW:0;
}

/* ==================== HELPERS ==================== */
function getSpec(cat,typeId){
const c=CATS[cat]; if(!c) return null;
return c.devices.find(d=>d.id===typeId)||null;
}
function devName(spec){ return LANG==='ar'?spec.nameAr:spec.nameEn; }
function catName(key){ return T('cat_'+key); }
function brandName(k){ return k.charAt(0).toUpperCase()+k.slice(1); }

function clearGroup(g){
while(g.children.length){
const c=g.children[0];g.remove(c);
c.traverse(o=>{
if(o.geometry)o.geometry.dispose();
if(o.material){
if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());
else o.material.dispose();
}
});
}
}

/* Interior bounds - critical for placement validation */
function getInteriorBounds(){
return {
hw: ROOM.size[0]/2 - WALL_T - 0.15,
hd: ROOM.size[1]/2 - WALL_T - 0.15
};
}
function getExteriorBounds(){
return {
hw: ROOM.size[0] * 0.9,
hd: ROOM.size[1] * 0.9
};
}
function getColumnPositions(){
const W=ROOM.size[0],D=ROOM.size[1];
const hw=W/2,hd=D/2;
const colCols=Math.max(2,Math.floor(W/7));
const colRows=Math.max(2,Math.floor(D/7));
const colSpacingX=W/(colCols+1),colSpacingZ=D/(colRows+1);
const cols=[];
for(let i=0;i<colCols;i++){
for(let j=0;j<colRows;j++){
const cx=-hw+colSpacingX*(i+1);
const cz=-hd+colSpacingZ*(j+1);
if(Math.abs(cx)<2.5 && cz<-hd+3) continue;
cols.push({x:cx,z:cz,r:0.45});
}
}
return cols;
}
function validatePlacement(x,z,spec){
if(!spec) return 'invalid';
const hd=ROOM.size[1]/2;
const mihrabW=3.2;
if(spec.outdoor){
const eb=getExteriorBounds();
if(Math.abs(x)>eb.hw || Math.abs(z)>eb.hd) return 'too_far';
return null;
}
const ib=getInteriorBounds();
if(Math.abs(x)>ib.hw || Math.abs(z)>ib.hd) return 'outside';
// Column collision
for(const c of getColumnPositions()){
if(Math.hypot(x-c.x,z-c.z)<c.r+0.2) return 'column';
}
// Minbar zone
const minbarX=mihrabW/2+1.6;
const minbarZ=-hd+0.4+1.3;
if(Math.abs(x-minbarX)<1.0 && Math.abs(z-minbarZ)<1.5) return 'minbar';
// Mihrab niche
if(Math.abs(x)<1.8 && z<-hd+1.0) return 'mihrab';
return null;
}
function placementErrorMsg(code){
const m={outside:'msg_outside',column:'msg_column',minbar:'msg_minbar',mihrab:'msg_mihrab',too_far:'msg_outdoor_only'};
return T(m[code]||'msg_outside');
}

/* ==================== ROOM BUILDER ==================== */
function buildRoom(){
clearGroup(roomGrp);
const W=ROOM.size[0],D=ROOM.size[1],H=ROOM.height;
const hw=W/2,hd=D/2;

const floor=new THREE.Mesh(new THREE.BoxGeometry(W,0.1,D),M.marbleCream());
floor.position.set(0,0.05,0);floor.receiveShadow=true;roomGrp.add(floor);

const carpetW=W-2.4,carpetD=D-2.4;
const carpet=new THREE.Mesh(new THREE.BoxGeometry(carpetW,0.02,carpetD),M.carpet());
carpet.position.set(0,0.11,0);carpet.receiveShadow=true;roomGrp.add(carpet);

const walls=[
{x:0,z:-hd,w:W,d:WALL_T},{x:0,z:hd,w:W,d:WALL_T},
{x:-hw,z:0,w:WALL_T,d:D},{x:hw,z:0,w:WALL_T,d:D}
];
for(const wp of walls){
const w=new THREE.Mesh(new THREE.BoxGeometry(wp.w,H,wp.d),(wp.z!==0)?M.wall():M.wallSide());
w.position.set(wp.x,H/2,wp.z);w.castShadow=true;w.receiveShadow=true;roomGrp.add(w);
const dado=new THREE.Mesh(new THREE.BoxGeometry(wp.w*0.98,0.9,wp.d*1.02),M.marble());
dado.position.set(wp.x,0.45,wp.z);roomGrp.add(dado);
}

const addWindow=(x,z,ry)=>{
const winW=1.4,winH=Math.min(2.4,H*0.4);
const grp=new THREE.Group();
const frame=new THREE.Mesh(new THREE.TorusGeometry(winW*0.5,0.08,6,20,Math.PI),M.windowFrame());
frame.position.y=winH*0.5;grp.add(frame);
const glass=new THREE.Mesh(new THREE.PlaneGeometry(winW,winH*0.5),M.glass());
glass.position.y=winH*0.25;grp.add(glass);
grp.position.set(x,H*0.5,z);grp.rotation.y=ry;roomGrp.add(grp);
};
const winCount=Math.max(2,Math.floor(D/4));
for(let i=0;i<winCount;i++){
const z=-hd+1.5+(i+0.5)*((D-3)/winCount);
addWindow(-hw+0.05,z,Math.PI/2);
addWindow(hw-0.05,z,-Math.PI/2);
}

let heatMesh=null;
const SPL_STOPS=[[40,0.05,0.10,0.45],[52,0.00,0.30,0.80],[62,0.00,0.65,0.95],[70,0.00,0.90,0.90],[76,0.30,0.90,0.45],[82,0.85,0.90,0.25],[88,1.00,0.65,0.15],[94,1.00,0.25,0.10],[100,0.85,0.05,0.15]];
function splRGB(v){
const S=SPL_STOPS,N=S.length;
if(v<=S[0][0]) return [S[0][1],S[0][2],S[0][3]];
if(v>=S[N-1][0]) return [S[N-1][1],S[N-1][2],S[N-1][3]];
for(let i=0;i<N-1;i++){
const a=S[i],b=S[i+1];
if(v>=a[0]&&v<=b[0]){
const t=(v-a[0])/(b[0]-a[0]);
return [a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t];
}
}
return [1,1,1];
}
function disposeHeat(){
if(heatMesh){heatGrp.remove(heatMesh);heatMesh.geometry.dispose();heatMesh.material.dispose();heatMesh=null;}
}
function buildHeatmap(){
disposeHeat();
if(!state.showHeat) return;
const hasSpk=state.devices.some(d=>d.cat==='speakers'||d.cat==='outdoor');
if(!hasSpk){
document.getElementById('hudSpl').textContent='—';
document.getElementById('hudCoverage').textContent='0%';
document.getElementById('hudSti').textContent='—';
return;
}
const geo=new THREE.PlaneGeometry(ROOM.size[0]-2*WALL_T,ROOM.size[1]-2*WALL_T,48,48);
geo.rotateX(-Math.PI/2);
const colors=new Float32Array(geo.attributes.position.count*3);
geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
heatMesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:0.62,depthWrite:false,side:THREE.DoubleSide}));
heatMesh.position.y=0.14;
heatMesh.renderOrder=1;
heatGrp.add(heatMesh);
updateHeatColors();
}
let _heatRAF=null;
function scheduleHeatUpdate(){
if(!heatMesh) return;
if(_heatRAF) return;
_heatRAF=requestAnimationFrame(()=>{_heatRAF=null;updateHeatColors();});
}
function updateHeatColors(){
if(!heatMesh) return;
const pos=heatMesh.geometry.attributes.position;
const col=heatMesh.geometry.attributes.color;
let mx=0,covered=0;
const total=pos.count;
for(let i=0;i<total;i++){
const x=pos.getX(i),z=pos.getZ(i);
const v=calcSPL(x,z);
if(v>mx) mx=v;
if(v>=65) covered++;
const c=splRGB(v);
col.setXYZ(i,c[0],c[1],c[2]);
}
col.needsUpdate=true;
document.getElementById('hudSpl').textContent=mx>0?mx.toFixed(0)+' dB':'—';
const covPct=total>0?Math.round((covered/total)*100):0;
document.getElementById('hudCoverage').textContent=covPct+'%';
const sti=calcSTI(0,0);
document.getElementById('hudSti').textContent=sti>0?sti.toFixed(2):'—';
const sSpl=document.getElementById('statSpl'),sCov=document.getElementById('statCov'),sSti=document.getElementById('statSti');
[sSpl,sCov,sSti].forEach(el=>el.classList.remove('good','warn','bad'));
if(mx>=80&&mx<=95) sSpl.classList.add('good'); else if(mx>0) sSpl.classList.add('warn');
if(covPct>=85) sCov.classList.add('good'); else if(covPct>=60) sCov.classList.add('warn'); else sCov.classList.add('bad');
if(sti>=0.6) sSti.classList.add('good'); else if(sti>=0.45) sSti.classList.add('warn'); else if(sti>0) sSti.classList.add('bad');
updateInfoAccStats();
}
function buildLegend(){
const bar=document.getElementById('legendBar');
const stops=SPL_STOPS.map(([v,r,g,b])=>{
const pct=((v-40)/60)*100;
return `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)}) ${pct}%`;
}).join(',');
bar.style.background=`linear-gradient(to top, ${stops})`;

/* ==================== CAMERA ==================== */
function updateCamera(){
const {theta,phi,radius,target}=state.cam;
if(!target) return;
const x=target.x+radius*Math.sin(phi)*Math.sin(theta);
const y=target.y+radius*Math.cos(phi);
const z=target.z+radius*Math.sin(phi)*Math.cos(theta);
camera.position.set(x,Math.max(y,0.5),z);
camera.lookAt(target);
}
function tweenCamera(to,dur){
state.cam.tween={from:{theta:state.cam.theta,phi:state.cam.phi,radius:state.cam.radius,target:state.cam.target.clone()},to,dur,start:performance.now()};
}
function updateTween(){
const t=state.cam.tween; if(!t) return;
const p=Math.min(1,(performance.now()-t.start)/t.dur);
const e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
state.cam.theta=t.from.theta+(t.to.theta-t.from.theta)*e;
state.cam.phi=t.from.phi+(t.to.phi-t.from.phi)*e;
state.cam.radius=t.from.radius+(t.to.radius-t.from.radius)*e;
state.cam.target.lerpVectors(t.from.target,t.to.target,e);
updateCamera();
if(p>=1) state.cam.tween=null;
}
function setView3D(on){
state.view3D=on;
const btn=document.getElementById('viewBtn');
btn.textContent=on?'✏️ 2D':'🎬 3D';
btn.classList.toggle('on',!on);
const r=Math.max(ROOM.size[0],ROOM.size[1])*1.35;
if(on) tweenCamera({theta:-0.6,phi:0.9,radius:r,target:new THREE.Vector3(0,2,0)},900);
else tweenCamera({theta:0,phi:0.02,radius:r,target:new THREE.Vector3(0,0,0)},900);
}
function fitView(){
const r=Math.max(ROOM.size[0],ROOM.size[1])*1.35;
if(state.view3D) tweenCamera({theta:-0.6,phi:0.9,radius:r,target:new THREE.Vector3(0,2,0)},700);
else tweenCamera({theta:0,phi:0.02,radius:r,target:new THREE.Vector3(0,0,0)},700);
}

/* ==================== INTERACTION ==================== */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const activePointers=new Map();
let isDown=false,moved=false,dragDev=null;
let dragOff={x:0,z:0},startPt={x:0,y:0},pinchStart=null;

function snapVal(v,step=0.5){return state.snap?Math.round(v/step)*step:v;}
function canvasPos(cx,cy){
const r=canvas.getBoundingClientRect();
pointer.x=((cx-r.left)/r.width)*2-1;
pointer.y=-((cy-r.top)/r.height)*2+1;
}
function hitDevice(cx,cy){
canvasPos(cx,cy);
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(devGrp.children,true);
for(const h of hits){
let o=h.object;
while(o&&o.userData.devId===undefined) o=o.parent;
if(o) return o;
}
return null;
}
const floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function floorPoint(cx,cy){
canvasPos(cx,cy);
raycaster.setFromCamera(pointer,camera);
const p=new THREE.Vector3();
return raycaster.ray.intersectPlane(floorPlane,p)?p:null;
}

canvas.addEventListener('pointerdown',e=>{
activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(activePointers.size===1){
startPt={x:e.clientX,y:e.clientY};
isDown=true;moved=false;dragDev=null;
const hit=hitDevice(e.clientX,e.clientY);
if(hit && !state.presentation){
dragDev=hit;
const fp=floorPoint(e.clientX,e.clientY);
if(fp){dragOff.x=hit.userData.dev.x-fp.x;dragOff.z=hit.userData.dev.z-fp.z;}
}
} else if(activePointers.size===2){
dragDev=null;isDown=false;moved=true;
const pts=[...activePointers.values()];
pinchStart={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1,radius:state.cam.radius};
}
},{passive:true});

canvas.addEventListener('pointermove',e=>{
// Ghost preview (only if valid)
if(!isDown && !state.presentation){
const fp=floorPoint(e.clientX,e.clientY);
if(fp){
const spec=getSpec(state.curCat,state.curType);
const err=spec?validatePlacement(snapVal(fp.x,0.5),snapVal(fp.z,0.5),spec):'invalid';
if(!err){
ghostRing.position.x=snapVal(fp.x,0.5);
ghostRing.position.z=snapVal(fp.z,0.5);
ghostRing.material.color.setHex(0xd4af37);
ghostRing.visible=true;
} else {
ghostRing.position.x=snapVal(fp.x,0.5);
ghostRing.position.z=snapVal(fp.z,0.5);
ghostRing.material.color.setHex(0xff7a9c);
ghostRing.visible=true;
}
} else ghostRing.visible=false;
}
if(!activePointers.has(e.pointerId)) return;
const prev=activePointers.get(e.pointerId);
activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(activePointers.size===2 && pinchStart){
const pts=[...activePointers.values()];
const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1;
state.cam.radius=Math.max(4,Math.min(220,pinchStart.radius*(pinchStart.dist/d)));
state.cam.tween=null;updateCamera();return;
}
if(!isDown) return;
const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
if(Math.abs(e.clientX-startPt.x)+Math.abs(e.clientY-startPt.y)>6) moved=true;
if(dragDev && moved){
const fp=floorPoint(e.clientX,e.clientY);
if(fp){
const d=dragDev.userData.dev;
const newX=snapVal(fp.x+dragOff.x,0.5);
const newZ=snapVal(fp.z+dragOff.z,0.5);
const spec=getSpec(d.cat,d.typeId);
const err=validatePlacement(newX,newZ,spec);
if(!err){
d.x=newX;d.z=newZ;
dragDev.position.set(d.x,dragDev.userData.spec.h,d.z);
if(state.showHeat) scheduleHeatUpdate();
updateInfo();
}
}
} else if(!dragDev && moved && !state.presentation){
if(state.view3D){
state.cam.tween=null;
state.cam.theta-=dx*0.008;
state.cam.phi=Math.max(0.12,Math.min(1.52,state.cam.phi+dy*0.008));
updateCamera();
} else {
state.cam.tween=null;
const ps=state.cam.radius*0.0018;
state.cam.target.x-=(dx*Math.cos(state.cam.theta)-dy*Math.sin(state.cam.theta))*ps;
state.cam.target.z-=(dx*Math.sin(state.cam.theta)+dy*Math.cos(state.cam.theta))*ps;
updateCamera();
}
}
},{passive:true});

function endPointer(e){
activePointers.delete(e.pointerId);
if(activePointers.size===0){
if(isDown && !moved && !state.presentation){
if(e.shiftKey){
const fp=floorPoint(e.clientX,e.clientY);
if(fp) showProbe(e.clientX,e.clientY,fp.x,fp.z);
isDown=false;return;
}
const hit=hitDevice(e.clientX,e.clientY);
if(hit){
const additive=e.ctrlKey||e.metaKey;
select(hit.userData.devId,additive);
} else if(state.selection.size>0){
deselect();
} else {
const fp=floorPoint(e.clientX,e.clientY);
if(fp){
const x=snapVal(fp.x,0.5),z=snapVal(fp.z,0.5);
const spec=getSpec(state.curCat,state.curType);
if(spec){
const err=validatePlacement(x,z,spec);
if(!err){placeDevice(x,z);pushHistory();}
else{toastErr(placementErrorMsg(err));}
}
}
}
} else if(dragDev && moved){
pushHistory();
if(state.showHeat) scheduleHeatUpdate();
}
isDown=false;dragDev=null;moved=false;pinchStart=null;
} else {
pinchStart=null;isDown=false;dragDev=null;moved=true;
}
}
canvas.addEventListener('pointerup',endPointer,{passive:true});
canvas.addEventListener('pointercancel',endPointer,{passive:true});
canvas.addEventListener('pointerleave',()=>{ghostRing.visible=false;});
canvas.addEventListener('wheel',e=>{
e.preventDefault();
state.cam.tween=null;
const factor=e.deltaY>0?1.1:0.9;
state.cam.radius=Math.max(4,Math.min(220,state.cam.radius*factor));
updateCamera();
},{passive:false});

function select(id,additive){
if(!additive) state.selection.clear();
if(state.selection.has(id)) state.selection.delete(id);
else state.selection.add(id);
updateSelectionVisuals();
if(state.selection.size>0){updateInfo();document.getElementById('info').classList.add('on');}
else document.getElementById('info').classList.remove('on');
}
function deselect(){
state.selection.clear();

document.getElementById('info').classList.remove('on');
}
function deleteSelected(){
if(state.selection.size===0) return;
const n=state.selection.size;
state.devices=state.devices.filter(d=>!state.selection.has(d.id));
state.selection.clear();
document.getElementById('info').classList.remove('on');
buildDevices();if(state.showHeat) buildHeatmap();
updateHUD();pushHistory();
toast(T('msg_deleted')+' ('+n+')');
}
function duplicateSelected(){
if(state.selection.size===0) return;
const newIds=new Set(),copies=[];
state.devices.forEach(d=>{
if(state.selection.has(d.id)){
const c={...d,id:state.nextId++,x:d.x+1,z:d.z+1};
const spec=getSpec(c.cat,c.typeId);
if(!validatePlacement(c.x,c.z,spec)){
copies.push(c);newIds.add(c.id);
}
}
});
state.devices.push(...copies);
state.selection=newIds;
buildDevices();if(state.showHeat) buildHeatmap();updateHUD();
pushHistory();
toast(T('msg_dup')+' ('+copies.length+')');
}

function updateInfoAccStats(){

/* ==================== ANALYSIS HELPERS ==================== */
function calcCoverageStats(){
const samples=[];
const ib=getInteriorBounds();
const step=0.7;
for(let x=-ib.hw;x<=ib.hw;x+=step){
for(let z=-ib.hd;z<=ib.hd;z+=step){
samples.push(calcSPL(x,z));
}
}
const valid=samples.filter(v=>v>0);
if(valid.length===0) return {mean:0,min:0,max:0,std:0,uniformity:0,coverage:0,count:0};
const sum=valid.reduce((a,b)=>a+b,0);
const mean=sum/valid.length;
const min=Math.min(...valid);
const max=Math.max(...valid);
const variance=valid.reduce((a,b)=>a+(b-mean)*(b-mean),0)/valid.length;
const std=Math.sqrt(variance);
const uniformity=mean>0?Math.max(0,1-(std/mean)):0;
const covered=valid.filter(v=>v>=65).length;
const coverage=covered/valid.length;
return {mean,min,max,std,uniformity,coverage,count:valid.length};
}
function calcSTIStats(){
const stis=[];
const ib=getInteriorBounds();
const step=0.9;
for(let x=-ib.hw;x<=ib.hw;x+=step){
for(let z=-ib.hd;z<=ib.hd;z+=step){
stis.push(calcSTI(x,z));
}
}
const valid=stis.filter(v=>v>0);
if(valid.length===0) return {mean:0,min:0,max:0,pct50:0,count:0};
const mean=valid.reduce((a,b)=>a+b,0)/valid.length;
const min=Math.min(...valid);
const max=Math.max(...valid);
const pct50=valid.filter(v=>v>=0.5).length/valid.length;
return {mean,min,max,pct50,count:valid.length};
}
function calcCriticalDistance(){
const ac=getAcoustics();
const Q=2; // ceiling speaker typical
return 0.141*Math.sqrt(Q*ac.R);
}

/* ==================== REPORT ==================== */
function makeRT60Chart(rt60){
const w=460,h=160,pad=40;
const vals=BAND_FREQS.map(f=>rt60[f]);
const maxV=Math.max(...vals)*1.15;
const barW=(w-pad*2)/BAND_FREQS.length*0.6;
const gap=(w-pad*2)/BAND_FREQS.length;
let bars='';
const targetY=h-pad-(1.6/maxV)*(h-pad*1.5);
bars+=`<line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="#ff7a9c" stroke-dasharray="4,3" stroke-width="1.5"/>`;
bars+=`<text x="${w-pad-4}" y="${targetY-4}" text-anchor="end" font-size="9" fill="#ff7a9c">1.6s</text>`;
BAND_FREQS.forEach((f,i)=>{
const v=rt60[f];
const bh=(v/maxV)*(h-pad*1.5);
const x=pad+i*gap+(gap-barW)/2;
const y=h-pad-bh;
const color=v>2.2?'#ff7a9c':v>1.8?'#ffc94d':'#4fe4b8';
bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}" rx="2"/>`;
bars+=`<text x="${x+barW/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">${v.toFixed(2)}</text>`;
bars+=`<text x="${x+barW/2}" y="${h-pad+12}" text-anchor="middle" font-size="9" fill="#a8b0cc">${f>=1000?(f/1000)+'k':f}</text>`;
});
return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-width:520px"><text x="${pad}" y="14" font-size="10" fill="#ffc94d" font-weight="700">RT60 (s)</text>${bars}</svg>`;
}

/* ==================== LANGUAGE ==================== */
function applyLang(){
document.documentElement.lang=LANG;
document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
document.body.style.fontFamily=LANG==='ar'?"'Cairo','Inter',sans-serif":"'Inter','Cairo',sans-serif";
document.querySelectorAll('[data-i18n]').forEach(el=>{
const k=el.dataset.i18n;
if(I18N[LANG][k]) el.textContent=I18N[LANG][k];
});
document.querySelectorAll('[data-i18n-title]').forEach(el=>{
const k=el.dataset.i18nTitle;
if(I18N[LANG][k]) el.title=I18N[LANG][k];
});
document.title=T('title');
document.getElementById('loaderTxt').textContent=T('loader');
document.getElementById('roomLabel').textContent=T('app_sub');
document.getElementById('langLabel').textContent=LANG==='ar'?'EN':'ع';
document.getElementById('viewBtn').textContent=state.view3D?'✏️ 2D':'🎬 3D';
document.getElementById('presToggle').textContent=LANG==='ar'?'🎥 بدء العرض':'🎥 Start';
// Rebuild dynamic UI
buildCats();buildBrands();buildTypes();
if(state.selection.size>0) updateInfo();
if(document.getElementById('reportModal').classList.contains('on')) generateReport();
}
document.getElementById('langBtn').onclick=()=>{
LANG=LANG==='ar'?'en':'ar';
localStorage.setItem('auralis_lang',LANG);
applyLang();
toast(LANG==='ar'?'🌐 العربية':'🌐 English');
};

/* ==================== EVENTS ==================== */
document.getElementById('reportBtn').onclick=generateReport;
document.getElementById('closeModalBtn').onclick=()=>document.getElementById('reportModal').classList.remove('on');
document.getElementById('closeModalBtn2').onclick=()=>document.getElementById('reportModal').classList.remove('on');
document.getElementById('printReportBtn').onclick=()=>window.print();

document.getElementById('saveBtn').onclick=()=>{
const data=JSON.stringify({app:'AURALIS',version:3,roomSize:ROOM.size.slice(),roomHeight:ROOM.height,devices:state.devices},null,2);
const blob=new Blob([data],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='auralis-mosque-'+Date.now()+'.json';
document.body.appendChild(a);a.click();
setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
toast(T('msg_saved'));
};
document.getElementById('loadBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
const file=e.target.files[0]; if(!file) return;
const reader=new FileReader();
reader.onload=ev=>{
try{
const data=JSON.parse(ev.target.result);
state.devices=(data.devices||[]).map(d=>({id:d.id,brand:BRANDS[d.brand]?d.brand:'motivity',cat:CATS[d.cat]?d.cat:'speakers',typeId:d.typeId,x:+d.x||0,z:+d.z||0,rot:+d.rot||0,power:+d.power||0})).filter(d=>getSpec(d.cat,d.typeId));
state.nextId=state.devices.length?Math.max(...state.devices.map(d=>d.id))+1:1;
if(data.roomSize) ROOM.size=data.roomSize.slice();
if(data.roomHeight) ROOM.height=data.roomHeight;
document.getElementById('roomWSlider').value=ROOM.size[0];
document.getElementById('roomDSlider').value=ROOM.size[1];
document.getElementById('roomHSlider').value=ROOM.height;
document.getElementById('roomWVal').textContent=ROOM.size[0]+'m';
document.getElementById('roomDVal').textContent=ROOM.size[1]+'m';
document.getElementById('roomHVal').textContent=ROOM.height+'m';
invalidateAcoustics();
buildRoom();buildDevices();buildHeatmap();updateHUD();fitView();
state.history=[serialize()];state.historyIdx=0;
updateUndoRedo();
toast(T('msg_loaded'));
}catch(err){toastErr(T('msg_invalid'));}
};
reader.readAsText(file);
e.target.value='';
};

document.getElementById('viewBtn').onclick=()=>setView3D(!state.view3D);
document.getElementById('shotBtn').onclick=()=>{
renderer.render(scene,camera);
const a=document.createElement('a');
a.href=canvas.toDataURL('image/png');
a.download='auralis-mosque-'+Date.now()+'.png';
document.body.appendChild(a);a.click();a.remove();
toast(T('msg_screenshot'));
};
document.getElementById('presBtn').onclick=togglePres;
document.getElementById('presToggle').onclick=togglePres;
document.getElementById('exitPres').onclick=togglePres;
function togglePres(){
state.presentation=!state.presentation;
document.getElementById('hd').classList.toggle('hide',state.presentation);
document.getElementById('tools').classList.toggle('hide',state.presentation);
document.getElementById('picker').classList.toggle('hide',state.presentation);
document.getElementById('hud').style.opacity=state.presentation?'0':'1';
document.getElementById('legend').classList.toggle('hide',state.presentation);
document.getElementById('info').classList.remove('on');
document.getElementById('exitPres').classList.toggle('on',state.presentation);
ghostRing.visible=false;
toast(state.presentation?T('msg_pres_on'):T('msg_pres_off'));
}
document.getElementById('heatBtn').onclick=function(){
state.showHeat=!state.showHeat;
this.classList.toggle('on',state.showHeat);
document.getElementById('legend').classList.toggle('hide',!state.showHeat);
buildHeatmap();
toast(state.showHeat?T('msg_heat_on'):T('msg_heat_off'));
};
document.getElementById('fitBtn').onclick=fitView;
document.getElementById('gridBtn').onclick=function(){
state.showGrid=!state.showGrid;
this.classList.toggle('on',state.showGrid);
grid.visible=state.showGrid;
};
document.getElementById('camTopBtn').onclick=()=>{
const r=Math.max(ROOM.size[0],ROOM.size[1])*1.35;
tweenCamera({theta:0,phi:0.02,radius:r,target:new THREE.Vector3(0,0,0)},800);
};
document.getElementById('camQiblaBtn').onclick=()=>{
const r=Math.max(ROOM.size[0],ROOM.size[1])*0.8;
tweenCamera({theta:-0.05,phi:1.15,radius:r,target:new THREE.Vector3(0,2,-ROOM.size[1]*0.15)},800);
};
document.getElementById('snapBtn').onclick=function(){
state.snap=!state.snap;
this.classList.toggle('on',state.snap);
toast(state.snap?T('msg_snap_on'):T('msg_snap_off'));
};
document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
document.getElementById('dupBtn').onclick=duplicateSelected;
document.getElementById('dupBtn2').onclick=duplicateSelected;
document.getElementById('autoBtn').onclick=autoLayout;
document.getElementById('shareBtn').onclick=shareURL;
document.getElementById('clearBtn').onclick=()=>{
showConfirm('⚠️',T('msg_confirm_clear'),()=>{
state.devices=[];state.selection.clear();
document.getElementById('info').classList.remove('on');
buildDevices();buildHeatmap();updateHUD();pushHistory();
toast(T('msg_cleared'));
});
};
document.getElementById('delBtn').onclick=deleteSelected;
document.getElementById('cfNo').onclick=()=>{
document.getElementById('confirmModal').classList.remove('on');
_cfCallback=null;
};
document.getElementById('cfYes').onclick=()=>{
document.getElementById('confirmModal').classList.remove('on');
const cb=_cfCallback;_cfCallback=null;
if(cb) cb();
};
document.getElementById('powerSlider').oninput=e=>{
if(state.selection.size!==1) return;
const id=[...state.selection][0];
const d=state.devices.find(x=>x.id===id); if(!d) return;
d.power=parseInt(e.target.value,10)||0;
document.getElementById('powerVal').textContent=d.power+'W';
document.getElementById('infPower').textContent=d.power+' W';
if(state.showHeat) scheduleHeatUpdate();
};
document.getElementById('powerSlider').onchange=()=>pushHistory();
document.getElementById('rotSlider').oninput=e=>{
if(state.selection.size!==1) return;
const id=[...state.selection][0];
const d=state.devices.find(x=>x.id===id); if(!d) return;
d.rot=parseInt(e.target.value,10)*Math.PI/180;
const m=meshById.get(d.id);
if(m) m.rotation.y=d.rot;
document.getElementById('rotVal').textContent=e.target.value+'°';
if(state.showHeat) scheduleHeatUpdate();
};
document.getElementById('rotSlider').onchange=()=>pushHistory();
document.getElementById('roomWSlider').oninput=e=>{document.getElementById('roomWVal').textContent=e.target.value+'m';};
document.getElementById('roomDSlider').oninput=e=>{document.getElementById('roomDVal').textContent=e.target.value+'m';};
document.getElementById('roomHSlider').oninput=e=>{document.getElementById('roomHVal').textContent=e.target.value+'m';};
document.getElementById('roomWSlider').onchange=e=>{resizeRoom(parseInt(e.target.value,10),ROOM.size[1]);};
document.getElementById('roomDSlider').onchange=e=>{resizeRoom(ROOM.size[0],parseInt(e.target.value,10));};
document.getElementById('roomHSlider').onchange=e=>{resizeRoom(ROOM.size[0],ROOM.size[1],parseFloat(e.target.value));};
document.querySelectorAll('.presetBtns button').forEach(btn=>{
btn.onclick=()=>{
const p=btn.dataset.preset;
if(p==='small') resizeRoom(12,10,5);
if(p==='medium') resizeRoom(20,16,6.5);
if(p==='large') resizeRoom(32,24,9);
};
});
document.addEventListener('keydown',e=>{
const tag=(e.target.tagName||'').toUpperCase();
if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
const ctrl=e.ctrlKey||e.metaKey;
if(ctrl&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
else if(ctrl&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
else if(ctrl&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelected();}
else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();}
else if(e.key==='Escape'){deselect();document.getElementById('reportModal').classList.remove('on');document.getElementById('confirmModal').classList.remove('on');}
else if(e.key==='Tab'){e.preventDefault();setView3D(!state.view3D);}
});

/* ==================== RESIZE / ANIMATE ==================== */
function onResize(){
const w=window.innerWidth,h=window.innerHeight;
camera.aspect=w/h;
camera.updateProjectionMatrix();
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(w,h,false);
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,250));

function animate(now){
requestAnimationFrame(animate);
updateTween();
const t=(now||0)*0.003;
devGrp.children.forEach(m=>{
const r=m.getObjectByName('selRing');
if(r&&r.material.opacity>0) r.scale.setScalar(1+Math.sin(t)*0.08);
});
if(ghostRing.visible) ghostRing.material.opacity=0.55+Math.sin(t*2)*0.15;
renderer.render(scene,camera);
}

/* ==================== INIT ==================== */
function loadPresetDevices(){
for(const item of ROOM.devices){
const [brand,cat,typeId,x,z,rot]=item;
const spec=getSpec(cat,typeId); if(!spec) continue;
state.devices.push({id:state.nextId++,brand,cat,typeId,x,z,rot:rot||0,power:spec.power});
}
}
function loadInitialDevices(){
state.devices=[];state.nextId=1;state.selection.clear();
if(loadFromHash()){
} else {
const saved=localStorage.getItem('auralis_autosave');
if(saved){
try{
const data=JSON.parse(saved);
if(data.devices&&data.devices.length){
state.devices=data.devices;
state.nextId=state.devices.length?Math.max(...state.devices.map(d=>d.id))+1:1;
if(data.roomSize) ROOM.size=data.roomSize.slice();
if(data.roomHeight) ROOM.height=data.roomHeight;
} else loadPresetDevices();
}catch(e){loadPresetDevices();}
} else loadPresetDevices();
}
invalidateAcoustics();
buildRoom();buildDevices();buildHeatmap();updateHUD();deselect();
document.getElementById('roomWSlider').value=ROOM.size[0];
document.getElementById('roomDSlider').value=ROOM.size[1];
document.getElementById('roomHSlider').value=ROOM.height;
document.getElementById('roomWVal').textContent=ROOM.size[0]+'m';
document.getElementById('roomDVal').textContent=ROOM.size[1]+'m';
document.getElementById('roomHVal').textContent=ROOM.height+'m';
updateInfoAccStats();
state.history=[serialize()];state.historyIdx=0;
updateUndoRedo();
}

function init(){
try{
state.cam.target=new THREE.Vector3(0,1.5,0);
buildLegend();
loadInitialDevices();
applyLang();
onResize();
updateCamera();
requestAnimationFrame(animate);
setTimeout(()=>document.getElementById('loader').classList.add('off'),500);
console.log('%c✅ AURALIS v3 ready','color:#d4af37;font-weight:bold;font-size:14px');
}catch(err){
console.error('Init error:',err);
document.getElementById('loaderTxt').textContent='ERROR: '+err.message;
}
}
init();
</script>
</body>
</html>
