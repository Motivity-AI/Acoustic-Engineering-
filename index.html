<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURALIS · اختر البيئة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--panel:rgba(16,22,38,.94);--card:rgba(30,40,66,.6);
  --line:rgba(255,255,255,.08);--txt:#eef2ff;--txt2:#a8b0cc;--txt3:#6b7396;
  --vio:#9b7bff;--cyn:#4de5ff;--mint:#4fe4b8}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 50% -10%,rgba(155,123,255,.15),transparent 60%),
  radial-gradient(900px 500px at 10% 110%,rgba(77,229,255,.08),transparent 60%),
  var(--bg);
  color:var(--txt);font-family:'Cairo',sans-serif;padding:32px 18px 60px;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.logo{width:52px;height:52px;border-radius:14px;
  background:linear-gradient(135deg,var(--vio),var(--cyn));
  display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;
  box-shadow:0 12px 40px rgba(155,123,255,.5)}
h1{font-size:28px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#fff,#9b7bff 60%,#4de5ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--txt2);font-size:13.5px;margin-top:4px}
.stats{display:flex;gap:10px;margin:22px 0 30px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);padding:8px 16px;
  border-radius:12px;font-size:12px;color:var(--txt2);
  display:flex;align-items:center;gap:8px}
.pill b{color:var(--cyn);font-size:15px;font-weight:800}

section{margin-bottom:36px}
.sec-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;
  margin-bottom:14px;color:var(--txt);padding-inline-start:6px}
.sec-title .badge{background:rgba(155,123,255,.15);color:var(--vio);
  padding:2px 10px;border-radius:8px;font-size:11px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:18px 16px;text-decoration:none;color:var(--txt);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);cursor:pointer;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:16px;
  background:linear-gradient(135deg,rgba(155,123,255,.14),rgba(77,229,255,.06));
  opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:rgba(155,123,255,.5);
  box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(155,123,255,.2)}
.card:hover::before{opacity:1}
.card>*{position:relative;z-index:1}
.card .em{font-size:34px;line-height:1}
.card .nm{font-size:14px;font-weight:800}
.card .meta{font-size:11px;color:var(--txt3);font-family:monospace;
  display:flex;gap:10px;flex-wrap:wrap}
.card .meta span{display:flex;align-items:center;gap:3px}
.card .arrow{position:absolute;top:14px;inset-inline-end:14px;
  color:var(--txt3);font-size:16px;transition:all .3s}
.card:hover .arrow{color:var(--cyn);transform:translateX(-4px)}
.empty{color:var(--txt3);font-size:12.5px;padding:20px;text-align:center;
  border:1px dashed var(--line);border-radius:12px}
footer{text-align:center;color:var(--txt3);font-size:11.5px;margin-top:40px;
  font-family:monospace;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">≈</div>
    <div>
      <h1>AURALIS</h1>
      <div class="sub">مجموعة التصميم الصوتي الاحترافية · اختر بيئة للبدء</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div id="sections"></div>

  <footer>AURALIS © 2026 · Modular Acoustic Suite</footer>
</div>

<script src="assets/data.js"></script>
<script>
(function(){
  // تصنيف البيئات تلقائيًا
  const groups = {
    religious: { title:'🕌 دور العبادة', ids:['mosque_indoor','mosque_outdoor','church'] },
    indoor:    { title:'🏛️ قاعات وأنشطة داخلية', ids:['conference','cinema','theater','wedding','restaurant','classroom','office','shop','studio'] },
    sport:     { title:'🏟️ ملاعب ومنشآت رياضية', ids:['stadium','stadium_field','arena','tennis','race','golf'] },
    transport: { title:'🚉 نقل ومطارات', ids:['airport','train','bus','parking','marina'] },
    public:    { title:'🏙️ فضاءات عامة', ids:['plaza','street','park','beach','waterpark','zoo','festival','amusement','resort','school_yard'] },
    special:   { title:'🎯 خاصة', ids:['empty'] }
  };

  const used = new Set();
  const sectionsEl = document.getElementById('sections');
  const stats = document.getElementById('stats');

  // احسب الإحصائيات
  stats.innerHTML = `
    <div class="pill">🏗️ <b>${Object.keys(ROOMS).length}</b> بيئة جاهزة</div>
    <div class="pill">🎛️ <b>${Object.values(CATS).reduce((a,c)=>a+c.devices.length,0)}</b> جهاز</div>
    <div class="pill">🏷️ <b>${Object.keys(BRANDS).length}</b> علامة تجارية</div>
  `;

  // اعرض كل قسم
  for (const key in groups) {
    const g = groups[key];
    const validIds = g.ids.filter(id => ROOMS[id] && !used.has(id));
    validIds.forEach(id => used.add(id));
    if (!validIds.length) continue;

    const sec = document.createElement('section');
    sec.innerHTML = `<div class="sec-title">
      ${g.title}
      <span class="badge">${validIds.length}</span>
    </div>`;

    const grid = document.createElement('div');
    grid.className = 'grid';

    for (const id of validIds) {
      const r = ROOMS[id];
      const devCount = r.devices ? r.devices.length : 0;
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `room.html?id=${id}`;
      card.innerHTML = `
        <span class="arrow">←</span>
        <div class="em">${r.name.split(' ')[0]}</div>
        <div class="nm">${r.name.substring(r.name.indexOf(' ')+1)}</div>
        <div class="meta">
          <span>📐 ${r.size[0]}×${r.size[1]}م</span>
          <span>🔊 ${devCount}</span>
        </div>
      `;
      grid.appendChild(card);
    }
    sec.appendChild(grid);
    sectionsEl.appendChild(sec);
  }

  // أي بيئة لم تُذكر في المجموعات تُضاف لقسم "أخرى"
  const leftovers = Object.keys(ROOMS).filter(id => !used.has(id));
  if (leftovers.length) {
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="sec-title">📦 أخرى <span class="badge">${leftovers.length}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    leftovers.forEach(id => {
      const r = ROOMS[id];
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `room.html?id=${id}`;
      card.innerHTML = `
        <span class="arrow">←</span>
        <div class="em">${r.name.split(' ')[0]}</div>
        <div class="nm">${r.name.substring(r.name.indexOf(' ')+1)}</div>
        <div class="meta">
          <span>📐 ${r.size[0]}×${r.size[1]}م</span>
          <span>🔊 ${r.devices?r.devices.length:0}</span>
        </div>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    sectionsEl.appendChild(sec);
  }
})();
</script>
</body>
</html>
