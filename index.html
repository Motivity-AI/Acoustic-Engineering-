<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">

<title>AURALIS · اختر البيئة</title>

<style>
*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --bg:#0a0e1a;
  --panel:rgba(16,22,38,.94);
  --card:rgba(30,40,66,.55);
  --line:rgba(255,255,255,.08);
  --line2:rgba(155,123,255,.35);
  --txt:#eef2ff;
  --txt2:#a8b0cc;
  --txt3:#6b7396;
  --vio:#9b7bff;
  --cyn:#4de5ff;
  --mint:#4fe4b8;
  --amb:#ffc94d;
  --gold:#d4af37;
  --font:'Cairo','Inter',sans-serif
}

html[lang="en"]{
  --font:'Inter','Cairo',sans-serif
}

html{
  min-height:100%;
  scroll-behavior:smooth
}

body{
  min-height:100vh;
  background:
    radial-gradient(1200px 700px at 50% -10%,rgba(155,123,255,.18),transparent 65%),
    radial-gradient(900px 600px at 5% 110%,rgba(77,229,255,.09),transparent 60%),
    radial-gradient(700px 500px at 95% 90%,rgba(212,175,55,.07),transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:var(--font);
  padding:26px 16px 70px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden
}

button,input{
  font:inherit
}

button{
  -webkit-appearance:none;
  appearance:none
}

.wrap{
  max-width:1280px;
  margin:0 auto
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:8px;
  flex-wrap:wrap
}

.logo{
  width:56px;
  height:56px;
  border-radius:16px;
  flex-shrink:0;
  background:linear-gradient(135deg,var(--vio),var(--cyn));
  display:grid;
  place-items:center;
  font-size:28px;
  font-weight:900;
  color:#fff;
  box-shadow:0 12px 40px rgba(155,123,255,.5);
  position:relative;
  overflow:hidden
}

.logo::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 60%);
  pointer-events:none
}

.titles{
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:1;
  min-width:0
}

h1{
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
  line-height:1.1;
  background:linear-gradient(135deg,#fff,#9b7bff 55%,#4de5ff);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.sub{
  color:var(--txt2);
  font-size:13.5px;
  font-weight:600;
  line-height:1.5
}

.langBtn{
  min-height:42px;
  padding:0 14px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--txt);
  font-family:inherit;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0;
  transition:all .2s;
  backdrop-filter:blur(14px)
}

.langBtn:hover{
  border-color:var(--vio);
  color:var(--vio)
}

.langBtn:active{
  transform:scale(.96)
}

.langBtn .flag{
  font-size:16px
}

/* STATS */

.stats{
  display:flex;
  gap:10px;
  margin:24px 0 26px;
  flex-wrap:wrap
}

.pill{
  background:var(--panel);
  border:1px solid var(--line);
  padding:10px 18px;
  border-radius:14px;
  font-size:12.5px;
  color:var(--txt2);
  display:flex;
  align-items:center;
  gap:9px;
  backdrop-filter:blur(14px);
  font-weight:600
}

.pill b{
  color:var(--cyn);
  font-size:17px;
  font-weight:900
}

/* SEARCH */

.searchWrap{
  position:relative;
  margin-bottom:28px
}

.searchInput{
  width:100%;
  height:50px;
  padding:0 46px 0 18px;
  border-radius:14px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--txt);
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  backdrop-filter:blur(14px);
  transition:border-color .2s;
  -webkit-appearance:none;
  appearance:none
}

.searchInput:focus{
  outline:none;
  border-color:var(--vio);
  box-shadow:0 0 0 4px rgba(155,123,255,.12)
}

.searchInput::placeholder{
  color:var(--txt3)
}

.searchIcon{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  inset-inline-start:16px;
  font-size:18px;
  color:var(--txt3);
  pointer-events:none
}

/* SECTIONS */

section{
  margin-bottom:38px;
  animation:fadeUp .5s ease-out backwards
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

.sec-title{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:16px;
  font-weight:800;
  margin-bottom:14px;
  padding-inline-start:4px;
  line-height:1.6
}

.sec-title .badge{
  background:rgba(155,123,255,.15);
  color:var(--vio);
  padding:3px 11px;
  border-radius:9px;
  font-size:11.5px;
  font-weight:800;
  border:1px solid rgba(155,123,255,.25)
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px 16px;
  text-decoration:none;
  color:var(--txt);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:9px;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(14px);
  min-width:0;
  min-height:145px
}

.card::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(155,123,255,.16),rgba(77,229,255,.05));
  opacity:0;
  transition:opacity .3s;
  pointer-events:none
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(155,123,255,.5);
  box-shadow:0 20px 55px rgba(0,0,0,.35),0 0 0 1px rgba(155,123,255,.18)
}

.card:hover::before{
  opacity:1
}

.card:focus-visible{
  outline:2px solid var(--cyn);
  outline-offset:3px
}

.card>*{
  position:relative;
  z-index:1
}

.card .em{
  font-size:38px;
  line-height:1.2;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))
}

.card .nm{
  font-size:14.5px;
  font-weight:800;
  line-height:1.5;
  padding-inline-end:12px
}

.card .meta{
  font-size:11.5px;
  color:var(--txt3);
  font-family:'Inter','Cairo',sans-serif;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:4px
}

.card .meta span{
  display:flex;
  align-items:center;
  gap:4px
}

.card .arrow{
  position:absolute;
  top:16px;
  inset-inline-end:16px;
  color:var(--txt3);
  font-size:17px;
  font-weight:700;
  transition:all .3s;
  opacity:.8
}

.card:hover .arrow{
  color:var(--cyn);
  transform:translateX(-4px);
  opacity:1
}

html[lang="en"] .card:hover .arrow{
  transform:translateX(4px)
}

/* ALL ENVIRONMENTS ENABLED */

.card.ready{
  cursor:pointer
}

.card.ready .status{
  color:var(--mint);
  font-size:10px;
  font-weight:800;
  margin-inline-start:auto
}

.card .status{
  display:inline-flex;
  align-items:center;
  gap:4px
}

/* EMPTY SEARCH RESULTS */

.noResults{
  grid-column:1/-1;
  text-align:center;
  color:var(--txt3);
  padding:40px 20px;
  font-size:14px;
  border:1px dashed var(--line);
  border-radius:14px;
  background:rgba(16,22,38,.45)
}

/* FOOTER */

footer{
  text-align:center;
  color:var(--txt3);
  font-size:11.5px;
  margin-top:50px;
  font-family:'Inter','Cairo',sans-serif;
  letter-spacing:.4px;
  line-height:2
}

footer .brand{
  color:var(--vio);
  font-weight:800
}

/* TOAST */

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:12px 24px;
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  border:1px solid var(--line2);
  font-size:13.5px;
  font-weight:700;
  color:var(--txt);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s,transform .25s;
  z-index:200;
  white-space:normal;
  text-align:center;
  width:max-content;
  max-width:90vw;
  box-shadow:0 14px 45px rgba(0,0,0,.6)
}

.toast.on{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

/* RESPONSIVE */

@media(max-width:600px){
  body{
    padding:18px 12px 60px
  }

  h1{
    font-size:24px;
    letter-spacing:2px
  }

  .logo{
    width:48px;
    height:48px;
    font-size:24px;
    border-radius:14px
  }

  .sub{
    font-size:12px
  }

  .langBtn{
    min-height:38px;
    padding:0 11px;
    font-size:12px
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px
  }

  .card{
    padding:14px 12px;
    border-radius:14px;
    gap:7px;
    min-height:130px
  }

  .card .em{
    font-size:30px
  }

  .card .nm{
    font-size:13px
  }

  .card .meta{
    font-size:10.5px;
    gap:8px
  }

  .pill{
    padding:8px 12px;
    font-size:11.5px
  }

  .pill b{
    font-size:15px
  }

  .searchInput{
    height:46px;
    font-size:13px
  }

  .sec-title{
    font-size:14.5px
  }

  footer{
    font-size:10px
  }
}

@media(max-width:360px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .card{
    padding:12px 9px
  }

  .card .nm{
    font-size:12px
  }

  .stats{
    gap:7px
  }

  .pill{
    padding:7px 9px
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important
  }
}
</style>

/* ============================================================
   DOM HELPERS
   ============================================================ */

const $ = selector => document.querySelector(selector);

let toastTO = null;

function toast(message){
  const el = $('#toast');

  el.textContent = message;
  el.classList.add('on');

  clearTimeout(toastTO);

  toastTO = setTimeout(() => {
    el.classList.remove('on');
  },2600);
}

/* ============================================================
   LANGUAGE
   ============================================================ */

function applyLang(){
  document.documentElement.lang = LANG;

  document.documentElement.dir =
    LANG === 'ar' ? 'rtl' : 'ltr';

  document.body.style.fontFamily =
    LANG === 'ar'
      ? "'Cairo','Inter',sans-serif"
      : "'Inter','Cairo',sans-serif";

  $('#subtitle').textContent = T('subtitle');

  $('#langLabel').textContent =
    LANG === 'ar' ? 'EN' : 'ع';

  $('#searchInput').placeholder = T('search');

  $('#searchInput').setAttribute(
    'aria-label',
    T('search')
  );

  $('#footNote').textContent = T('footNote');

  document.title =
    LANG === 'ar'
      ? 'AURALIS · اختر البيئة'
      : 'AURALIS · Choose Environment';

  $('#langBtn').setAttribute(
    'aria-label',
    LANG === 'ar'
      ? 'Switch to English'
      : 'التبديل إلى العربية'
  );
}

/* ============================================================
   STATISTICS
   ============================================================ */

function updateStats(){
  const total = CATALOG.length;

  const ready = CATALOG.filter(
    room => room.ready === true
  ).length;

  $('#stats').replaceChildren();

  const stats = [
    {
      icon:'🏗️',
      value:total,
      label:T('environments')
    },
    {
      icon:'✅',
      value:ready,
      label:T('ready')
    },
    {
      icon:'🎛️',
      value:'60+',
      label:T('devices')
    }
  ];

  stats.forEach(item => {
    const pill = document.createElement('div');
    pill.className = 'pill';

    const icon = document.createElement('span');
    icon.textContent = item.icon;

    const value = document.createElement('b');
    value.textContent = item.value;

    const label = document.createElement('span');
    label.textContent = item.label;

    pill.append(icon,value,label);

    $('#stats').appendChild(pill);
  });
}

/* ============================================================
   ENVIRONMENT CARDS
   ============================================================ */

const GROUP_ORDER = [
  'religious',
  'indoor',
  'sport',
  'transport',
  'public',
  'special'
];

function createCard(room){
  const name = LANG === 'ar' ? room.ar : room.en;

  const card = document.createElement('a');

  card.className = 'card ready';

  card.href = room.file;

  card.setAttribute(
    'aria-label',
    name + ' — ' + T('open')
  );

  card.title = room.file;

  /* Arrow */

  const arrow = document.createElement('span');

  arrow.className = 'arrow';
  arrow.setAttribute('aria-hidden','true');

  arrow.textContent = LANG === 'ar' ? '←' : '→';

  /* Emoji */

  const emoji = document.createElement('div');

  emoji.className = 'em';
  emoji.setAttribute('aria-hidden','true');
  emoji.textContent = room.emoji;

  /* Environment name */

  const title = document.createElement('div');

  title.className = 'nm';
  title.textContent = name;

  /* Metadata */

  const meta = document.createElement('div');

  meta.className = 'meta';

  const dimensions = document.createElement('span');

  dimensions.textContent =
    '📐 ' + room.size[0] + ' × ' + room.size[1] + ' m';

  const status = document.createElement('span');

  status.className = 'status';
  status.textContent = '● ' + T('ready');

  meta.append(dimensions,status);

  card.append(arrow,emoji,title,meta);

  /*
    All cards navigate to their assigned HTML files.
    If a file does not exist, the browser will show a 404 page.
  */

  return card;
}

/* ============================================================
   RENDER ENVIRONMENTS
   ============================================================ */

function render(){
  const query = (
    $('#searchInput').value || ''
  ).trim().toLocaleLowerCase(
    LANG === 'ar' ? 'ar' : 'en'
  );

  const sectionsEl = $('#sections');

  sectionsEl.replaceChildren();

  let totalShown = 0;

  GROUP_ORDER.forEach(category => {

    const rooms = CATALOG.filter(room => {

      if(room.cat !== category){
        return false;
      }

      if(!query){
        return true;
      }

      const searchable = [
        room.id,
        room.ar,
        room.en,
        room.file
      ].join(' ').toLocaleLowerCase(
        LANG === 'ar' ? 'ar' : 'en'
      );

      return searchable.includes(query);
    });

    if(rooms.length === 0){
      return;
    }

    totalShown += rooms.length;

    const section = document.createElement('section');

    const heading = document.createElement('div');

    heading.className = 'sec-title';

    const headingText = document.createElement('span');

    headingText.textContent = T(
      'groups.' + category
    );

    const badge = document.createElement('span');

    badge.className = 'badge';
    badge.textContent = rooms.length;

    heading.append(headingText,badge);

    const grid = document.createElement('div');

    grid.className = 'grid';

    rooms.forEach(room => {
      grid.appendChild(createCard(room));
    });

    section.append(heading,grid);

    sectionsEl.appendChild(section);
  });

  if(totalShown === 0){
    const empty = document.createElement('div');

    empty.className = 'noResults';
    empty.textContent = T('noResults');

    sectionsEl.appendChild(empty);
  }
}

/* ============================================================
   EVENTS
   ============================================================ */

$('#langBtn').addEventListener('click',() => {

  LANG = LANG === 'ar' ? 'en' : 'ar';

  localStorage.setItem('auralis_lang',LANG);

  applyLang();
  updateStats();
  render();

  toast(
    LANG === 'ar'
      ? '🌐 تم التبديل إلى العربية'
      : '🌐 Switched to English'
  );
});

let searchTO = null;

$('#searchInput').addEventListener('input',() => {

  clearTimeout(searchTO);

  searchTO = setTimeout(() => {
    render();
  },100);
});

/* ============================================================
   VALIDATION
   ============================================================ */

function validateCatalog(){

  const ids = new Set();
  const files = new Set();

  const problems = [];

  CATALOG.forEach(room => {

    if(ids.has(room.id)){
      problems.push('Duplicate ID: ' + room.id);
    }

    ids.add(room.id);

    if(files.has(room.file)){
      problems.push('Duplicate HTML filename: ' + room.file);
    }

    files.add(room.file);

    if(room.ready !== true){
      problems.push('Environment not enabled: ' + room.id);
    }

    if(
      !room.file ||
      !room.file.toLowerCase().endsWith('.html')
    ){
      problems.push('Invalid HTML filename: ' + room.id);
    }
  });

  if(problems.length){
    console.error('AURALIS catalog validation:',problems);
  }

  console.info(
    'AURALIS catalog:',
    CATALOG.length,
    'environments;',
    CATALOG.filter(room => room.ready).length,
    'enabled;',
    files.size,
    'HTML filenames.'
  );

  console.info(
    'Note: filename registration does not create the HTML files.'
  );
}

/* ============================================================
   INITIALIZATION
   ============================================================ */

applyLang();
updateStats();
render();
validateCatalog();

console.log(
  '%c AURALIS — Environment Portal Ready ',
  'background:#9b7bff;color:#fff;font-weight:bold;padding:8px'
);

</script>
